/* ---------- events ---------- */
function wireEvents(){
  /* rail + bottom nav */
  $$('.rail-item, .bn-item').forEach(node => node.onclick = () => setView(node.dataset.nav));
  $('#railAvatar').onclick = () => setView('settings');
  /* panel */
  $('#newChatBtn').onclick = openNewChat;
  $('#panelMenuBtn').onclick = e => { e.stopPropagation(); panelMenu(e.clientX - 180, e.clientY + 10); };
  $('#fab').onclick = openNewChat;
  $('#chatSearch').addEventListener('input', e => { state.chatQuery = e.target.value; renderChatList(); });
  $$('.filter-pill').forEach(pill => pill.onclick = () => {
    $$('.filter-pill').forEach(x => x.classList.toggle('active', x === pill));
    state.filter = pill.dataset.filter;
    renderChatList();
  });
  /* new chat panel */
  $('#newChatBack').onclick = closeNewChat;
  $('#newContactAdd').onclick = addContactByPhone;
  $('#newContactPhone').addEventListener('keydown', e => { if (e.key === 'Enter') addContactByPhone(); });
  $('#contactSearch').addEventListener('input', e => renderContactList(e.target.value.trim().toLowerCase()));
  /* conversation head */
  $('#chatBack').onclick = closeChat;
  $('#convTitleWrap').onclick = openDrawer;
  $('#chatAvatarBtn').onclick = openDrawer;
  $('#findBtn').onclick = openFindBar;
  $('#chatMenuBtn').onclick = e => { e.stopPropagation(); chatHeaderMenu(e.clientX - 190, e.clientY + 10); };
  $('#findClose').onclick = closeFindBar;
  $('#findInput').addEventListener('input', e => runFind(e.target.value.trim()));
  $('#findPrev').onclick = () => gotoFind((state.find.index <= 0 ? state.find.count - 1 : state.find.index - 1));
  $('#findNext').onclick = () => gotoFind(state.find.index + 1);
  /* composer */
  $('#composer').onsubmit = e => { e.preventDefault(); if (state.pending) sendPending(); else sendText(); };
  $('#messageInput').addEventListener('input', e => {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 130) + 'px';
    updateSendButton();
    if (state.connection.connected && state.selected){
      if (!state.typing.sent){
        state.typing.sent = true;
        api('/api/typing', { method: 'POST', body: JSON.stringify({ jid: state.selected, typing: true }) }).catch(() => {});
      }
      clearTimeout(state.typing.timer);
      state.typing.timer = setTimeout(() => stopTyping(state.selected), 1300);
    }
  });
  $('#messageInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); if (state.pending) sendPending(); else sendText(); }
  });
  $('#emojiBtn').onclick = e => { e.stopPropagation(); if ($('#emojiSheet').hidden) openEmojiSheet('insert'); else closeEmojiSheet(); };
  $('#attachBtn').onclick = e => { e.stopPropagation(); const menu = $('#attachMenu'); menu.hidden = !menu.hidden; };
  $('#attachPhoto').onclick = () => { $('#attachMenu').hidden = true; $('#mediaInput').click(); };
  $('#attachDoc').onclick = () => { $('#attachMenu').hidden = true; $('#docInput').click(); };
  $('#attachArchive').onclick = () => { $('#attachMenu').hidden = true; openArchivePicker(); };
  $('#mediaInput').onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const mime = file.type || '';
    const kind = mime.startsWith('image/') ? 'image' : mime.startsWith('video/') ? 'video' : mime.startsWith('audio/') ? 'voice' : 'document';
    setPending({ type: 'upload', file, name: file.name, kind });
    e.target.value = '';
  };
  $('#docInput').onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setPending({ type: 'upload', file, name: file.name, kind: 'document' });
    e.target.value = '';
  };
  $('#pendingCancel').onclick = () => setPending(null);
  $('#pendingSend').onclick = sendPending;
  $('#replyCancel').onclick = () => { state.quoted = null; updateReplyBanner(); };
  $('#scrollFab').onclick = () => {
    const box = $('#messages');
    box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
    state.newSinceScroll = 0;
    updateScrollFab();
  };
  $('#messages').addEventListener('scroll', updateScrollFab);
  /* click-away closers */
  document.addEventListener('click', e => {
    if (activeMenu && !activeMenu.contains(e.target)) closeMenu();
    if (!$('#reactionBar').hidden && !$('#reactionBar').contains(e.target) && !e.target.closest('.bubble-actions')) closeReactionBar();
    if (!$('#emojiSheet').hidden && !$('#emojiSheet').contains(e.target) && !e.target.closest('#emojiBtn')) closeEmojiSheet();
    if (!$('#attachMenu').hidden && !$('#attachMenu').contains(e.target) && !e.target.closest('#attachBtn')) $('#attachMenu').hidden = true;
  });
  /* settings forms are re-bound after render */
  document.addEventListener('submit', async e => {
    if (e.target.id === 'profileForm'){
      e.preventDefault();
      const form = e.target;
      try {
        await api('/api/profile', { method: 'POST', body: JSON.stringify({ name: form.elements.name.value.trim(), about: form.elements.about.value.trim() }) });
        toast('WhatsApp profile updated.');
        loadProfile();
        loadProfileForAvatar();
      } catch (err) { toast(err.message, true); }
    }
    if (e.target.id === 'addRuleForm'){
      e.preventDefault();
      const f = new FormData(e.target);
      const schedule = String(f.get('schedule') || '').trim();
      try {
        await api('/api/autoreply', { method: 'POST', body: JSON.stringify({
          action: 'add',
          rule: {
            trigger: f.get('trigger'), usage: f.get('usage'), match: f.get('match'), message: f.get('message'),
            priority: Number(f.get('priority')), contacts: String(f.get('contacts') || '').split(',').map(x => x.trim()).filter(Boolean),
            schedule: /^\d{2}:\d{2}-\d{2}:\d{2}$/.test(schedule) ? { start: schedule.slice(0, 5), end: schedule.slice(6) } : null
          }
        }) });
        e.target.reset();
        toast('Rule added.');
        loadRules();
      } catch (err) { toast(err.message, true); }
    }
  });
  document.addEventListener('change', async e => {
    if (e.target.id === 'enabled'){
      try { await api('/api/autoreply', { method: 'POST', body: JSON.stringify({ enabled: e.target.checked }) }); toast('Auto-reply setting saved.'); }
      catch (err) { toast(err.message, true); loadRules(); }
    }
    if (e.target.id === 'profileFile'){
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const form = new FormData();
      form.set('file', file);
      try {
        const response = await fetch('/api/profile/picture?token=' + encodeURIComponent(TOKEN), { method: 'POST', body: form });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw Error(data.error || response.statusText);
        toast('Profile photo updated.');
        loadProfile();
      } catch (err) { toast(err.message, true); }
      e.target.value = '';
    }
  });
  document.addEventListener('click', async e => {
    const btn = e.target.closest('.settings-card .small-btn');
    if (btn && btn.textContent === 'Change photo'){ $('#profileFile')?.click(); }
    if (btn && btn.textContent === 'Remove photo'){
      try { await api('/api/profile/picture', { method: 'DELETE' }); toast('Profile photo removed.'); loadProfile(); }
      catch (err) { toast(err.message, true); }
    }
  });
  /* keyboard */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      if (closeMenu()) return;
      if (!$('#reactionBar').hidden) return closeReactionBar();
      if (!$('#emojiSheet').hidden) return closeEmojiSheet();
      if (!$('#attachMenu').hidden) return void ($('#attachMenu').hidden = true);
      if (!$('#dialogOverlay').hidden){ $('#dialogOverlay').hidden = true; return; }
      if (!$('#mediaViewer').hidden){ $('#mediaViewer').hidden = true; $('#mediaViewer').replaceChildren(); return; }
      if (!$('#statusViewer').hidden) return closeStatusViewer();
      if (!$('#newChatPanel').classList.contains('open')) { /* not open */ }
      else { closeNewChat(); return; }
      if (closeFindBar()) return;
      if ($('#drawer').classList.contains('open')) return closeDrawer();
      if (window.innerWidth <= 700 && state.selected) return closeChat();
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')){
      e.preventDefault();
      if (state.selected && window.innerWidth > 700) openFindBar();
      else { setView('chats'); $('#chatSearch').focus(); }
    }
  });
  window.addEventListener('beforeunload', () => stopTyping(state.selected));
}

/* ---------- boot & polling ---------- */
async function boot(){
  mountIcons(document);
  renderWallpaper();
  wireEvents();
  if (await checkSecurityLock()) return;
  await Promise.all([loadPrefs(), loadConnection(), loadDailySummary()]);
  await loadChats();
  setView('chats');
  renderRailAvatar();
  renderHomeTokenIndicator();
  startTokenCountdownTicker();
  initFirebaseClient().catch(() => {});
  startPolling();
}
boot();
</script>
