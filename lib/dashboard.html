function buildMediaArchiveWidget(media, onUpdated){
  const box = el('div', 'media-widget');
  box.id = 'mediaArchiveWidget';
  const m = media || { usedMb: 0, maxMb: 200, percentUsed: 0, exceeded: false, totalFiles: 0, chatMediaCount: 0, statusOnlyCount: 0 };
  const head = el('div', 'media-head');
  head.append(el('strong', '', 'Media Archive (MEDIA_ARCHIVE_MAX_MB)'));
  const badgeCls = m.exceeded ? 'danger' : (m.percentUsed >= 85 ? 'warn' : 'ok');
  head.append(el('span', 'pill-badge ' + badgeCls, m.exceeded ? 'Limit Exceeded' : (m.percentUsed + '% Used')));
  box.append(head);

  box.append(quotaLine('Cached media storage', Number(m.usedMb || 0).toFixed(2) + ' MB', Number(m.maxMb || 0) + ' MB', Number(m.percentUsed || 0)));
  const fileTotal = Number(m.files ?? m.totalFiles ?? 0);
  box.append(el('div', 'crm-hint', fileTotal + ' files archived (' + (m.chatMediaCount || 0) + ' chat · ' + (m.statusOnlyCount || 0) + ' status)'));

  const actions = el('div', 'mon-badges');
  const clearExceededBtn = el('button', m.exceeded ? 'primary' : 'small-btn', m.exceeded ? 'Clear cache (limit exceeded)' : 'Clear if exceeded');
  clearExceededBtn.type = 'button';
  clearExceededBtn.id = 'clearMediaExceededBtn';
  clearExceededBtn.style.width = 'auto';
  if (m.exceeded){ clearExceededBtn.style.padding = '7px 12px'; clearExceededBtn.style.fontSize = '12.5px'; }
  clearExceededBtn.onclick = async () => {
    clearExceededBtn.disabled = true;
    try {
      const out = await api('/api/media/clear-cache', { method: 'POST', body: JSON.stringify({ onlyIfExceeded: true }) });
      if (out.cleared === false) toast('Cache is within MEDIA_ARCHIVE_MAX_MB limit (' + out.stats.usedMb + '/' + out.stats.maxMb + ' MB)');
      else toast('Cleared ' + out.clearedFiles + ' cached file(s) · ' + sizeLabel(out.freedBytes || 0));
      if (typeof onUpdated === 'function') onUpdated(out.stats);
    } catch (e) { toast(e.message, true); }
    finally { clearExceededBtn.disabled = false; }
  };
  const forceClearBtn = el('button', 'small-btn danger', 'Force clear cache');
  forceClearBtn.type = 'button';
  forceClearBtn.onclick = async () => {
    if (!(await dialog('Clear media archive cache?', 'This removes all locally cached media files (' + Number(m.usedMb || 0).toFixed(2) + ' MB). Metadata chats are preserved.', 'Clear cache', true))) return;
    forceClearBtn.disabled = true;
    try {
      const out = await api('/api/media/clear-cache', { method: 'POST', body: JSON.stringify({ onlyIfExceeded: false }) });
      toast('Cleared ' + out.clearedFiles + ' media file(s) · ' + sizeLabel(out.freedBytes || 0));
      if (typeof onUpdated === 'function') onUpdated(out.stats);
    } catch (e) { toast(e.message, true); }
    finally { forceClearBtn.disabled = false; }
  };
  actions.append(clearExceededBtn, forceClearBtn);
  box.append(actions);
  return box;
}

function sizeLabel(bytes){
  const value = Number(bytes) || 0;
  if (value >= 1048576) return (value / 1048576).toFixed(1) + ' MB';
  if (value >= 1024) return Math.round(value / 1024) + ' KB';
  return value + ' B';
}

function formatDurationSec(sec){
  const s = Math.max(0, Math.floor(Number(sec) || 0));
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  return (d ? d + 'd ' : '') + h + 'h ' + m + 'm';
}

function drawBotDependencyGraph(container, graph){
  container.replaceChildren();
  const nodes = (graph && graph.nodes) || [];
  const links = (graph && graph.links) || [];
  if (!nodes.length){
    container.append(el('div', 'empty-state', 'No bot dependency data available yet.'));
    return;
  }
  if (!window.d3){
    container.append(el('div', 'empty-state', 'Loading D3.js dependency visualizer…'));
    return;
  }

  const d3 = window.d3;
  const W = 760;
  const H = 430;
  const coords = {
    'bot-selinah':  { x: 380, y: 66 },
    'bot-montra':   { x: 380, y: 184 },
    'website-bot':  { x: 96,  y: 326 },
    'bot-caleb':    { x: 238, y: 344 },
    'bot-ruri':     { x: 380, y: 350 },
    'bot-katelina': { x: 522, y: 344 },
    'bot-derric':   { x: 664, y: 326 }
  };
  const nodeMap = new Map(nodes.map(n => [n.id, { ...n, ...(coords[n.id] || { x: 380, y: 220 }) }]));
  const relationStyle = {
    moderates:   { stroke: '#ff4d7d', dash: '6 4', label: 'Moderation / Veto Gate' },
    orchestrates:{ stroke: '#b46bff', dash: null,  label: 'Fleet Orchestration' },
    reports_to:  { stroke: '#ffd166', dash: '3 3', label: 'Telemetry Feed' },
    coordinates: { stroke: '#5be7ff', dash: '3 3', label: 'Context Sync' },
    delegates:   { stroke: '#00e9a5', dash: null,  label: 'Publish Handoff' }
  };

  const svg = d3.select(container)
    .append('svg')
    .attr('class', 'd3-map-svg')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('role', 'img')
    .attr('aria-label', 'Montra 6-Bot Dependency and Permissions Hierarchy Map');

  const defs = svg.append('defs');
  Object.entries(relationStyle).forEach(([rel, st]) => {
    defs.append('marker')
      .attr('id', `arrow-${rel}`)
      .attr('viewBox', '0 -5 10 10')
      .attr('refX', 28)
      .attr('refY', 0)
      .attr('markerWidth', 6)
      .attr('markerHeight', 6)
      .attr('orient', 'auto')
      .append('path')
      .attr('d', 'M0,-5L10,0L0,5')
      .attr('fill', st.stroke);
  });

  // Hierarchy swimlane bands
  const bands = [
    { y: 14,  h: 98,  title: 'TIER 0 · CRITICAL GOVERNANCE & ALLOW/DENY GATE' },
    { y: 124, h: 112, title: 'TIER 1 · UNIFIED FLEET ORCHESTRATOR' },
    { y: 252, h: 162, title: 'TIER 2 · ACCOUNT BRIDGE & SPECIALIST EXECUTORS' }
  ];
  const bandGroup = svg.append('g');
  bandGroup.selectAll('rect.tier-band')
    .data(bands)
    .join('rect')
    .attr('x', 14)
    .attr('y', d => d.y)
    .attr('width', W - 28)
    .attr('height', d => d.h)
    .attr('rx', 12)
    .attr('fill', 'rgba(180, 107, 255, 0.04)')
    .attr('stroke', 'rgba(180, 107, 255, 0.16)')
    .attr('stroke-width', 1);

  bandGroup.selectAll('text.tier-label')
    .data(bands)
    .join('text')
    .attr('x', 26)
    .attr('y', d => d.y + 18)
    .attr('fill', '#a99bc8')
    .attr('font-size', '10px')
    .attr('font-weight', '700')
    .attr('letter-spacing', '0.08em')
    .text(d => d.title);

  // Curved edges
  const linkPath = (d) => {
    const s = nodeMap.get(d.source);
    const t = nodeMap.get(d.target);
    if (!s || !t) return '';
    const dx = t.x - s.x;
    const dy = t.y - s.y;
    const dr = Math.sqrt(dx * dx + dy * dy) * 1.45;
    const sweep = d.relation === 'moderates' ? 0 : 1;
    return `M${s.x},${s.y}A${dr},${dr} 0 0,${sweep} ${t.x},${t.y}`;
  };

  const edgeGroup = svg.append('g');
  edgeGroup.selectAll('path.dep-link')
    .data(links)
    .join('path')
    .attr('d', linkPath)
    .attr('fill', 'none')
    .attr('stroke', d => (relationStyle[d.relation] || relationStyle.orchestrates).stroke)
    .attr('stroke-width', d => d.active ? Math.min(3.5, 1.8 + (d.trafficCount || 0) * 0.15) : 1.4)
    .attr('stroke-opacity', d => d.active ? 0.92 : 0.38)
    .attr('stroke-dasharray', d => (relationStyle[d.relation] || {}).dash || null)
    .attr('marker-end', d => `url(#arrow-${d.relation})`);

  // Traffic badges on active edges with bus messages
  const activeTraffic = links.filter(l => (l.trafficCount || 0) > 0);
  const badgeG = svg.append('g');
  badgeG.selectAll('text.edge-count')
    .data(activeTraffic)
    .join('text')
    .attr('x', d => {
      const s = nodeMap.get(d.source);
      const t = nodeMap.get(d.target);
      return s && t ? (s.x + t.x) / 2 + (d.relation === 'moderates' ? -14 : 10) : 0;
    })
    .attr('y', d => {
      const s = nodeMap.get(d.source);
      const t = nodeMap.get(d.target);
      return s && t ? (s.y + t.y) / 2 : 0;
    })
    .attr('fill', d => (relationStyle[d.relation] || relationStyle.orchestrates).stroke)
    .attr('font-size', '10px')
    .attr('font-weight', '700')
    .attr('text-anchor', 'middle')
    .text(d => `${d.trafficCount}`);

  // Bot nodes
  const nodeData = Array.from(nodeMap.values());
  const nodeG = svg.append('g')
    .selectAll('g.bot-node')
    .data(nodeData, d => d.id)
    .join('g')
    .attr('transform', d => `translate(${d.x},${d.y})`)
    .style('cursor', 'pointer')
    .on('click', (_ev, d) => {
      state.botComms.selectedNodeId = d.id;
      renderBotCommsView(true);
    });

  // Active pulse ring
  nodeG.filter(d => d.isActive)
    .append('circle')
    .attr('r', 31)
    .attr('fill', 'none')
    .attr('stroke', d => d.color)
    .attr('class', 'd3-node-active');

  // Selected halo
  nodeG.filter(d => d.id === state.botComms.selectedNodeId)
    .append('circle')
    .attr('r', 35)
    .attr('fill', 'none')
    .attr('stroke', '#ffffff')
    .attr('stroke-width', 1.8)
    .attr('stroke-dasharray', '4 3');

  // Main node circle
  nodeG.append('circle')
    .attr('r', 24)
    .attr('fill', d => d.enabled ? d.color : '#2b2438')
    .attr('fill-opacity', d => d.enabled ? 0.92 : 0.45)
    .attr('stroke', '#0d0718')
    .attr('stroke-width', 2.5);

  // Badge initials
  nodeG.append('text')
    .attr('y', 5)
    .attr('text-anchor', 'middle')
    .attr('fill', d => d.enabled ? '#0b0715' : '#a99bc8')
    .attr('font-size', '13px')
    .attr('font-weight', '800')
    .text(d => d.avatarBadge || d.name.slice(0, 2).toUpperCase());

  // Bot name
  nodeG.append('text')
    .attr('y', 40)
    .attr('text-anchor', 'middle')
    .attr('fill', 'var(--text)')
    .attr('font-size', '12px')
    .attr('font-weight', '700')
    .text(d => d.name);

  // Resource utilization bar under each bot node
  const barW = 86;
  nodeG.append('rect')
    .attr('x', -barW / 2)
    .attr('y', 47)
    .attr('width', barW)
    .attr('height', 6)
    .attr('rx', 3)
    .attr('fill', 'rgba(255,255,255,0.12)');

  nodeG.append('rect')
    .attr('x', -barW / 2)
    .attr('y', 47)
    .attr('width', d => Math.max(4, Math.round((Math.min(100, d.resourceUsage?.percent || 0) / 100) * barW)))
    .attr('height', 6)
    .attr('rx', 3)
    .attr('fill', d => d.color);

  nodeG.append('text')
    .attr('y', 65)
    .attr('text-anchor', 'middle')
    .attr('fill', 'var(--muted)')
    .attr('font-size', '10px')
    .text(d => `${d.isActive ? 'ACTIVE · ' : ''}${d.resourceUsage?.percent || 0}% load`);

  const legend = el('div', 'd3-legend');
  Object.values(relationStyle).forEach(st => {
    const item = el('span', 'd3-legend-item');
    const dot = el('span', 'd3-legend-dot');
    dot.style.background = st.stroke;
    item.append(dot, el('span', '', st.label));
    legend.append(item);
  });
  container.append(legend);
}

function updateBotCommsSilent(comms, graph){
  const badges = $('#botCommsMapBadges');
  if (badges && graph){
    const activeCount = (graph.nodes || []).filter(n => n.isActive).length;
    const sm = graph.systemMetrics || {};
    const pills = badges.querySelectorAll('.pill-badge');
    if (pills[0]) pills[0].textContent = activeCount + ' / ' + (graph.nodes || []).length + ' Active';
    if (pills[1]) pills[1].textContent = 'CPU ' + (sm.cpuPercent ?? 0) + '% · RAM ' + (sm.ramPercent ?? 0) + '%';
    if (pills[2]){
      pills[2].className = 'pill-badge ' + (sm.mediaPercent >= 80 ? 'warn' : 'info');
      pills[2].textContent = 'Media ' + (sm.mediaPercent ?? 0) + '%';
    }
  }
  const streamEl = $('#botCommsStream');
  if (streamEl && comms){
    const items = comms.items || [];
    const prevScroll = streamEl.scrollTop;
    const wasNearBottom = (streamEl.scrollHeight - streamEl.scrollTop - streamEl.clientHeight) < 60;
    streamEl.replaceChildren();
    if (!items.length){
      streamEl.append(el('div', 'empty-state', 'No bot thoughts or cross-bot messages match the current filter. Run a cycle or send a message below.'));
    } else {
      items.forEach(item => {
        const row = el('div', 'comms-row');
        row.style.borderLeftColor = item.botColor || '#b46bff';
        const head = el('div', 'comms-row-head');
        const who = el('div', 'comms-who');
        const dot = el('span', 'comms-dot');
        dot.style.background = item.botColor || '#b46bff';
        who.append(dot);
        const nameSpan = el('span', '', item.botName || item.botId);
        nameSpan.style.color = item.botColor || 'var(--text)';
        who.append(nameSpan);
        if (item.category === 'bus' && item.targetName){
          who.append(el('span', 'bot-role', '→ ' + item.targetName));
        }
        who.append(el('span', 'comms-tag ' + item.category,
          item.category === 'bus' ? ('BUS · ' + item.subType) : (item.category + ' · ' + item.subType)));
        if (item.priority === 'high' || item.priority === 'critical'){
          who.append(el('span', 'pill-badge danger', item.priority));
        }
        const time = el('span', 'comms-time', item.ts ? new Date(item.ts).toLocaleTimeString() : '');
        head.append(who, time);
        row.append(head, el('div', '', item.content || ''));
        streamEl.append(row);
      });
    }
    if (wasNearBottom) streamEl.scrollTop = streamEl.scrollHeight;
    else streamEl.scrollTop = prevScroll;
  }
}

async function renderBotCommsView(silent = false){
  const body = $('#panelBody');
  const prevScroll = body ? body.scrollTop : 0;
  const existingWrap = $('#botCommsViewWrap');
  if (silent && document.activeElement && body.contains(document.activeElement)) return;
  if (!silent && !existingWrap) body.replaceChildren(el('div', 'empty-state', 'Loading Bot Communication Stream & D3 Dependency Map…'));

  let comms, graph;
  try {
    const q = new URLSearchParams({
      limit: '150',
      category: state.botComms.category || 'all',
      botId: state.botComms.botId || 'all'
    });
    [comms, graph] = await Promise.all([
      api('/api/bots/comms?' + q.toString()),
      api('/api/bots/graph')
    ]);
  } catch (e) {
    if (!silent) body.replaceChildren(el('div', 'empty-state', e.message));
    return;
  }
  if (state.view !== 'botcomms') return;
  state.botComms.comms = comms;
  state.botComms.graph = graph;

  const commsSig = [
    (comms.items || []).length,
    (comms.items || []).slice(0, 3).map(i => (i.id || '') + ':' + (i.ts || '')).join(','),
    (graph.nodes || []).map(n => n.id + ':' + (n.isActive ? '1' : '0') + ':' + (n.resourceUsage?.percent || 0)).join('|'),
    (graph.systemMetrics?.cpuPercent ?? 0) + ':' + (graph.systemMetrics?.ramPercent ?? 0)
  ].join('@');

  if (silent && state.lastBotCommsSig === commsSig && existingWrap) return;
  state.lastBotCommsSig = commsSig;

  if (silent && existingWrap) {
    updateBotCommsSilent(comms, graph);
    return;
  }

  const wrap = el('div', 'analytics-wrap');
  wrap.id = 'botCommsViewWrap';

  /* Panel 1: D3.js Dependency & Permissions Hierarchy Map */
  const mapCard = el('div', 'settings-card analytics-card');
  const mapHead = el('div', 'card-head-row');
  mapHead.append(el('h3', '', 'D3.js Bot Dependency & Permissions Map'));
  const mapBadges = el('div', 'mon-badges');
  mapBadges.id = 'botCommsMapBadges';
  const activeCount = (graph.nodes || []).filter(n => n.isActive).length;
  const sm = graph.systemMetrics || {};
  mapBadges.append(
    el('span', 'pill-badge ok', activeCount + ' / ' + (graph.nodes || []).length + ' Active'),
    el('span', 'pill-badge info', 'CPU ' + (sm.cpuPercent ?? 0) + '% · RAM ' + (sm.ramPercent ?? 0) + '%'),
    el('span', 'pill-badge ' + (sm.mediaPercent >= 80 ? 'warn' : 'info'), 'Media ' + (sm.mediaPercent ?? 0) + '%')
  );
  const saveSnapBtn = el('button', 'small-btn', 'Save Snapshot');
  saveSnapBtn.title = 'Save current bot fleet telemetry snapshot to Firestore';
  saveSnapBtn.onclick = async () => {
    await saveBotSnapshotToFirestore(graph);
  };
  mapBadges.append(saveSnapBtn);
  mapHead.append(mapBadges);
  mapCard.append(mapHead);

  const mapBody = el('div', 'card-body');
  const mapShell = el('div', 'd3-map-shell');
  mapBody.append(mapShell);
  drawBotDependencyGraph(mapShell, graph);

  // Selected bot resource & permission inspector
  const selectedNode = (graph.nodes || []).find(n => n.id === state.botComms.selectedNodeId) || (graph.nodes || [])[0];
  if (selectedNode){
    const insp = el('div', 'd3-inspector');
    const top = el('div', 'media-head');
    const title = el('strong', '', selectedNode.name + ' (@' + selectedNode.handle + ') · ' + selectedNode.role);
    title.style.color = selectedNode.color;
    const roleTag = el('span', 'pill-badge ' + (selectedNode.isActive ? 'ok' : 'info'),
      selectedNode.permissionRole.replace(/_/g, ' ') + (selectedNode.isActive ? ' · ACTIVE' : ' · IDLE'));
    top.append(title, roleTag);
    insp.append(top);
    insp.append(el('div', 'bot-role',
      (selectedNode.resourceUsage?.label || 'Resource') + ': ' + (selectedNode.resourceUsage?.percent ?? 0) + '% (' + (selectedNode.resourceUsage?.detail || '') + ')'));
    insp.append(el('div', 'bot-summary', selectedNode.lastSummary || 'No recent activity recorded.'));
    mapBody.append(insp);
  }
  mapCard.append(mapBody);
  wrap.append(mapCard);

  const commsHead = el('div', 'card-head-row');
  commsHead.append(el('h3', '', 'Real-Time Bot Thoughts & Cross-Bot Logs'));
  const commsControls = el('div', 'mon-badges');

  const runCycleBtn = el('button', 'small-btn', 'Run Fleet Cycle');

      toast('Autonomous fleet cycle complete');
      renderBotCommsView(true);
    } catch (e) { toast(e.message, true); }
    finally { runCycleBtn.disabled = false; }
  };
  commsControls.append(refreshBtn, runCycleBtn);
  commsHead.append(commsControls);
  commsCard.append(commsHead);

  const commsBody = el('div', 'card-body');
  const toolbar = el('div', 'comms-toolbar');
  const catFilters = el('div', 'comms-filters');
  const counts = comms.counts || {};
  [
    { id: 'all', label: 'All' },
    { id: 'thought', label: 'Thoughts (' + (counts.thought || 0) + ')' },
    { id: 'bus', label: 'Cross-Bot Bus (' + (counts.bus || 0) + ')' },

    { id: 'action', label: 'Actions (' + (counts.action || 0) + ')' }

  botSelect.value = state.botComms.botId || 'all';
  botSelect.onchange = () => { state.botComms.botId = botSelect.value; renderBotCommsView(true); };
  toolbar.append(catFilters, botSelect);
  commsBody.append(toolbar);

  const streamEl = el('div', 'comms-stream');
  streamEl.id = 'botCommsStream';
  const items = comms.items || [];
  if (!items.length){
    streamEl.append(el('div', 'empty-state', 'No bot thoughts or cross-bot messages match the current filter. Run a cycle or send a message below.'));
  } else {
    items.forEach(item => {
      const row = el('div', 'comms-row');
      row.style.borderLeftColor = item.botColor || '#b46bff';
      const head = el('div', 'comms-row-head');
      const who = el('div', 'comms-who');
      const dot = el('span', 'comms-dot');
      dot.style.background = item.botColor || '#b46bff';
      who.append(dot);
      const nameSpan = el('span', '', item.botName || item.botId);
      nameSpan.style.color = item.botColor || 'var(--text)';
      who.append(nameSpan);
      if (item.category === 'bus' && item.targetName){
        who.append(el('span', 'bot-role', '→ ' + item.targetName));
      }
      who.append(el('span', 'comms-tag ' + item.category,
        item.category === 'bus' ? ('BUS · ' + item.subType) : (item.category + ' · ' + item.subType)));
      if (item.priority === 'high' || item.priority === 'critical'){
        who.append(el('span', 'pill-badge danger', item.priority));
      }
      const time = el('span', 'comms-time', item.ts ? new Date(item.ts).toLocaleTimeString() : '');
      head.append(who, time);
      row.append(head, el('div', '', item.content || ''));
      streamEl.append(row);
    });
  }
  commsBody.append(streamEl);

  // Quick live bus / thought composer
  const composerForm = el('form', 'bot-form');
  const row2 = el('div', 'bot-row-2');
  const fromSel = el('select');
  const toSel = el('select');
  toSel.append(new Option('To: All Bots (Broadcast)', 'all'));
  (comms.bots || []).forEach(b => {
    fromSel.append(new Option('From: ' + b.name, b.id));
    toSel.append(new Option('To: ' + b.name, b.id));
  });
  fromSel.value = 'bot-montra';
  toSel.value = 'bot-selinah';
  row2.append(fromSel, toSel);
  const msgInp = el('input');
  msgInp.placeholder = 'Send a cross-bot message or directive…';
  msgInp.required = true;
  const btnRow = el('div', 'mon-badges');
  const sendBusBtn = el('button', 'primary', 'Send Cross-Bot Message');
  sendBusBtn.type = 'submit';
  const thinkBtn = el('button', 'small-btn', 'Trigger Bot Thought');
  thinkBtn.type = 'button';
  thinkBtn.onclick = async () => {
    const prompt = msgInp.value.trim() || 'Assess current fleet readiness and next priority action.';
    thinkBtn.disabled = true;
    try {
      await api('/api/bots/message', { method: 'POST', body: JSON.stringify({ targetBot: fromSel.value, prompt, useAi: false, deep: true }) });
      msgInp.value = '';
      toast('Bot thought recorded');
      renderBotCommsView(true);
    } catch (e) { toast(e.message, true); }
    finally { thinkBtn.disabled = false; }
  };
  btnRow.append(sendBusBtn, thinkBtn);
  composerForm.append(row2, msgInp, btnRow);
  composerForm.onsubmit = async e => {
    e.preventDefault();
    if (!msgInp.value.trim()) return;
    sendBusBtn.disabled = true;
    try {
      await api('/api/bots/bus', { method: 'POST', body: JSON.stringify({ from: fromSel.value, to: toSel.value, topic: 'live_comms', content: msgInp.value.trim(), priority: 'normal' }) });
      msgInp.value = '';
      toast('Cross-bot message sent');
      renderBotCommsView(true);
    } catch (err) { toast(err.message, true); }
    finally { sendBusBtn.disabled = false; }
  };
  commsBody.append(el('div', 'summary-section-label', 'Live Cross-Bot Bus & Thought Trigger'), composerForm);

  commsCard.append(commsBody);
  wrap.append(commsCard);

  body.replaceChildren(wrap);
  if (silent) body.scrollTop = prevScroll;
}

function formatTokenCountdown(msRemaining){
  const totalSec = Math.max(0, Math.ceil(Number(msRemaining || 0) / 1000));
  const hrs = Math.floor(totalSec / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;
  const pad = n => String(n).padStart(2, '0');
  return hrs > 0 ? (pad(hrs) + ':' + pad(mins) + ':' + pad(secs)) : (pad(mins) + ':' + pad(secs));
}

      status: 'none',
      badgeClass: 'info',
      badgeText: 'No OAuth Token',
      countdown: '--:--',
      pct: 0,
      barClass: 'ws-token-fill',
      sub: fbClient.user
        ? 'Firebase session active; click Sign in with Google to issue a fresh OAuth access token.'
        : 'Sign in with Google to generate an in-memory OAuth access token for Workspace sync.'
    };
  }
  const now = Date.now();
  const remMs = tokenMeta.expiresAtMs > 0 ? Math.max(0, tokenMeta.expiresAtMs - now) : 0;
  const maxMs = Math.max(60000, Number(tokenMeta.maxTtlSec || 3600) * 1000);
  const pct = tokenMeta.valid && remMs > 0 ? Math.max(2, Math.min(100, Math.round((remMs / maxMs) * 100))) : 0;
  if (tokenMeta.status === 'expired' || !tokenMeta.valid || (tokenMeta.expiresAtMs > 0 && remMs <= 0)){
    return {
      status: 'expired',
      badgeClass: 'danger',
      badgeText: 'Token Expired',
      countdown: '00:00',
      pct: 0,
      barClass: 'ws-token-fill danger',
      sub: tokenMeta.reason || 'Google OAuth access token has expired or been revoked. Re-authorize to continue.'
    };
  }
  if (remMs <= 300000){
    return {
      status: 'expiring_soon',
      badgeClass: 'warn',
      badgeText: 'Expiring Soon',
      countdown: formatTokenCountdown(remMs),
      pct,
      barClass: 'ws-token-fill warn',
      sub: 'Expires at ' + new Date(tokenMeta.expiresAtMs).toLocaleTimeString() + ' · ' + (tokenMeta.scopeCount || 0) + ' scopes'
    };
  }
  return {
    status: 'valid',
    badgeClass: 'ok',
    badgeText: 'Token Valid',
    countdown: formatTokenCountdown(remMs),
    pct,
    barClass: 'ws-token-fill',
    sub: 'Expires at ' + new Date(tokenMeta.expiresAtMs).toLocaleTimeString() + ' · ' + (tokenMeta.scopeCount || 0) + ' scopes verified'
  };
}

function startTokenCountdownTicker(){
  if (tokenTickerStarted) return;
  tokenTickerStarted = true;
  setInterval(() => {
    updateTokenIndicatorDom();
    if (workspaceAccessToken && tokenMeta.expiresAtMs > 0 && Date.now() >= tokenMeta.expiresAtMs && !tokenMeta.autoCheckedExpired){
      tokenMeta.autoCheckedExpired = true;
      tokenMeta.status = 'expired';
      tokenMeta.valid = false;
      refreshTokenStatus(true);
    }
  }, 1000);
}

async function refreshTokenStatus(silent = false){
  if (!workspaceAccessToken){
    resetTokenMeta();
    updateTokenIndicatorDom();
    renderHomeTokenIndicator();
    if (state.view === 'workspace') renderWorkspaceView();
    return null;
  }
  tokenMeta.verifying = true;
  try {
    const res = await wsApi('/api/workspace/token-status');
    const expSec = Number(res.expiresIn || 0);
    tokenMeta = {
      status: res.status || (res.valid ? 'valid' : 'expired'),
      valid: Boolean(res.valid),
      expiresAtMs: Number(res.expiresAtMs) || (expSec > 0 ? Date.now() + expSec * 1000 : 0),
      expiresIn: expSec,
      maxTtlSec: Math.max(Number(tokenMeta.maxTtlSec || 3600), expSec || 3600),
      checkedAt: res.checkedAt || new Date().toISOString(),
      scopeCount: Number(res.scopeCount || 0),
      services: res.services || {},
      reason: res.reason || '',
      verifying: false,
      autoCheckedExpired: !res.valid
    };
    if (!silent) toast(tokenMeta.valid ? ('OAuth token valid (' + formatTokenCountdown(tokenMeta.expiresAtMs - Date.now()) + ' left)') : (tokenMeta.reason || 'OAuth token invalid or expired'), !tokenMeta.valid);
  } catch (err) {
    tokenMeta.verifying = false;
    if (!silent) toast(err.message || 'Unable to verify OAuth token', true);
  }
  updateTokenIndicatorDom();
  renderHomeTokenIndicator();
  if (state.view === 'workspace') renderWorkspaceView();
  return tokenMeta;
}

function isServiceSyncEnabled(serviceId){
  const rec = fbClient.serviceSync && fbClient.serviceSync[serviceId];
  if (rec && typeof rec.enabled === 'boolean') return rec.enabled;
  return true;
}

function handleFirestoreError(error, operationType, path){
  const user = fbClient.auth && fbClient.auth.currentUser;
  const errInfo = {
    error: error instanceof Error ? error.message : String(error),
    authInfo: {
      userId: user ? user.uid : null,
      email: user ? user.email : null,
      emailVerified: user ? user.emailVerified : false,
      isAnonymous: user ? user.isAnonymous : false,
      providerInfo: user && Array.isArray(user.providerData)
        ? user.providerData.map(p => ({ providerId: p.providerId, displayName: p.displayName, email: p.email }))
        : []
    },
    operationType,
    path
  };
  console.error('Firestore Error:', JSON.stringify(errInfo));
  fbClient.lastError = errInfo.error + ' (' + operationType + ' ' + path + ')';
  throw new Error(JSON.stringify(errInfo));
}

function detachFirestoreListeners(){
  while (fbClient.unsubs.length){
    const unsub = fbClient.unsubs.pop();
    try { unsub(); } catch {}
  }
}

async function initFirebaseClient(){
  if (fbClient.initialized) return fbClient;
  if (fbClient.initializing) return fbClient.initializing;
  fbClient.initializing = (async () => {
    const [cfg, appMod, authMod, fsMod] = await Promise.all([
      api('/api/firebase-config'),
      import('/vendor/firebase-app.js'),
      import('/vendor/firebase-auth.js'),
      import('/vendor/firebase-firestore.js')
    ]);
    fbClient.config = cfg;
    fbClient.mods = { appMod, authMod, fsMod };
    const existingApps = appMod.getApps ? appMod.getApps() : [];
    fbClient.app = existingApps.length ? existingApps[0] : appMod.initializeApp(cfg);
    fbClient.auth = authMod.getAuth(fbClient.app);
    fbClient.db = cfg.firestoreDatabaseId ? fsMod.getFirestore(fbClient.app, cfg.firestoreDatabaseId) : fsMod.getFirestore(fbClient.app);

    // Startup Firestore connection check per firebase-integration-rpc with auto-reconnection & offline fallback
    try {
      await fsMod.getDocFromServer(fsMod.doc(fbClient.db, 'test', 'connection'));
      fbClient.connectionOk = true;
      fbClient.connectionError = '';
    } catch (err) {
      const msg = err && err.message ? err.message : String(err);
      if (msg.includes('the client is offline') || msg.includes('offline')) {
        fbClient.connectionOk = false;
        fbClient.connectionError = 'Please check your Firebase configuration (Firestore client is offline).';
        console.error(fbClient.connectionError);
        try {
          if (fsMod.enableNetwork) {
            await fsMod.enableNetwork(fbClient.db);
            await fsMod.getDocFromServer(fsMod.doc(fbClient.db, 'test', 'connection'));
            fbClient.connectionOk = true;
            fbClient.connectionError = '';
            console.log('Firestore reconnected successfully via enableNetwork.');
          }
        } catch (reconnectErr) {
          console.warn('Firestore offline fallback activated: running in cached/degraded mode.', reconnectErr.message);
        }
      } else {
        // Expected before sign-in if rules require auth for /test/connection
        fbClient.connectionOk = true;
        fbClient.connectionError = '';
      }
    }

    authMod.onAuthStateChanged(fbClient.auth, async (user) => {
      fbClient.user = user || null;
      if (!user) {
        resetTokenMeta();
        detachFirestoreListeners();
        fbClient.snapshots = [];
        fbClient.notes = [];
        fbClient.serviceSync = {};
        fbClient.syncLoaded = false;
        renderHomeTokenIndicator();
        if (state.view === 'workspace') renderWorkspaceView();
        return;
      }
      if (user.emailVerified) {
        try {
          await ensureUserProfileDoc(user);
          await ensureServiceSyncDefaults(user);
        } catch (e) { console.warn(e.message); }
        attachFirestoreListeners(user.uid);
      }
      renderHomeTokenIndicator();
      if (state.view === 'workspace') renderWorkspaceView();
    });

    fbClient.initialized = true;
    updateFirestoreDiagnosticOverlay();
    return fbClient;
  })().finally(() => { 
    fbClient.initializing = null; 
    updateFirestoreDiagnosticOverlay();
  });
  return fbClient.initializing;
}

function updateFirestoreDiagnosticOverlay(){
  const overlay = $('#firestoreDiagnosticOverlay');
  const statusEl = $('#firestoreDiagnosticStatus');
  const retryBtn = $('#firestoreRetryBtn');
  if (!overlay || !statusEl || !retryBtn) return;

  if (fbClient.connectionOk === true){
    statusEl.innerHTML = '<span style="color:#00e9a5;font-weight:700">● Connected</span> · Firestore active and responding.';
    retryBtn.textContent = 'Recheck Connection';
  } else if (fbClient.connectionOk === false){
    statusEl.innerHTML = '<span style="color:#ff4d7d;font-weight:700">● Offline</span> · ' + (fbClient.connectionError || 'Firestore client is offline.');
    retryBtn.textContent = 'Retry Connection';
    overlay.hidden = false;
  } else {
    statusEl.innerHTML = '<span style="color:#ffd166;font-weight:700">● Connecting</span> · Initializing Firestore client...';
    retryBtn.textContent = 'Retry Connection';
  }
}

async function retryFirestoreConnection(){
  fbClient.initialized = false;
  fbClient.initializing = null;
  fbClient.connectionOk = null;
  fbClient.connectionError = '';
  updateFirestoreDiagnosticOverlay();
  toast('Re-initializing Firestore client...');
  try {
    await initFirebaseClient();
    updateFirestoreDiagnosticOverlay();
    if (fbClient.connectionOk){
      toast('Firestore connected successfully!');
    } else {
      toast('Firestore client is still offline.', true);
    }
  } catch (err) {
    updateFirestoreDiagnosticOverlay();
    toast('Firestore connection error: ' + err.message, true);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const retryBtn = $('#firestoreRetryBtn');
  if (retryBtn) retryBtn.onclick = retryFirestoreConnection;
  updateFirestoreDiagnosticOverlay();
});

async function ensureUserProfileDoc(user){
  const { fsMod } = fbClient.mods;
  const userPath = 'users/' + user.uid;
  const ref = fsMod.doc(fbClient.db, 'users', user.uid);
  try {
    const snap = await fsMod.getDoc(ref);
    if (!snap.exists()) {
      await fsMod.setDoc(ref, {
        uid: user.uid,
        email: user.email || '',
        displayName: (user.displayName || user.email || 'Operator').slice(0, 120),
        role: 'operator',
        createdAt: fsMod.serverTimestamp(),
        updatedAt: fsMod.serverTimestamp()
      });
    } else {
      await fsMod.updateDoc(ref, {
        displayName: (user.displayName || user.email || 'Operator').slice(0, 120),
        email: user.email || '',
        updatedAt: fsMod.serverTimestamp()
      });
    }
  } catch (err) {
    handleFirestoreError(err, OperationType.WRITE, userPath);
  }
}

async function ensureServiceSyncDefaults(user){
  if (!user || !user.emailVerified) return;
  const { fsMod } = fbClient.mods;
  const uid = user.uid;
  const colPath = 'users/' + uid + '/serviceSync';
  let existingIds = new Set();
  try {
    const qs = await fsMod.getDocs(fsMod.collection(fbClient.db, 'users', uid, 'serviceSync'));
    qs.docs.forEach(d => existingIds.add(d.id));
  } catch (err) {
    handleFirestoreError(err, OperationType.LIST, colPath);
  }
  for (const svc of WORKSPACE_SERVICES){
    if (existingIds.has(svc.id)) continue;
    const p = colPath + '/' + svc.id;
    try {
      await fsMod.setDoc(fsMod.doc(fbClient.db, 'users', uid, 'serviceSync', svc.id), {
        ownerId: uid,
        serviceId: svc.id,
        enabled: true,
        lastStatus: 'idle',
        lastSyncedAt: '',
        createdAt: fsMod.serverTimestamp(),
        updatedAt: fsMod.serverTimestamp()
      });
    } catch (err) {
      handleFirestoreError(err, OperationType.CREATE, p);
    }
  }
}

async function updateServiceSyncRecord(serviceId, patch){
  if (!fbClient.user) return;
  const { fsMod } = fbClient.mods;
  const uid = fbClient.user.uid;
  const p = 'users/' + uid + '/serviceSync/' + serviceId;
  const ref = fsMod.doc(fbClient.db, 'users', uid, 'serviceSync', serviceId);
  const exists = Boolean(fbClient.serviceSync && fbClient.serviceSync[serviceId]);
  try {
    if (exists){
      await fsMod.updateDoc(ref, {
        enabled: typeof patch.enabled === 'boolean' ? patch.enabled : isServiceSyncEnabled(serviceId),
        lastStatus: String(patch.lastStatus || 'idle'),
        lastSyncedAt: String(patch.lastSyncedAt !== undefined ? patch.lastSyncedAt : ((fbClient.serviceSync[serviceId] && fbClient.serviceSync[serviceId].lastSyncedAt) || '')).slice(0, 64),
        updatedAt: fsMod.serverTimestamp()
      });
    } else {
      await fsMod.setDoc(ref, {
        ownerId: uid,
        serviceId,
        enabled: typeof patch.enabled === 'boolean' ? patch.enabled : true,
        lastStatus: String(patch.lastStatus || 'idle'),
        lastSyncedAt: String(patch.lastSyncedAt || '').slice(0, 64),
        createdAt: fsMod.serverTimestamp(),
        updatedAt: fsMod.serverTimestamp()
      });
    }
  } catch (err) {
    handleFirestoreError(err, exists ? OperationType.UPDATE : OperationType.CREATE, p);
  }
}

async function toggleServiceSync(serviceId, enabled){
  try {
    await initFirebaseClient();
    if (!fbClient.user){
      toast('Sign in with Google first to save service sync toggles to Firebase.', true);
      if (state.view === 'workspace') renderWorkspaceView();
      return;
    }
    await ensureUserProfileDoc(fbClient.user);
    await updateServiceSyncRecord(serviceId, {
      enabled: Boolean(enabled),
      lastStatus: enabled ? 'idle' : 'paused'
    });
    if (!enabled && state.workspace.data[serviceId]){
      delete state.workspace.data[serviceId];
    }
    const svc = WORKSPACE_SERVICES.find(s => s.id === serviceId);
    toast((svc ? svc.label : serviceId) + ' sync ' + (enabled ? 'enabled' : 'paused'));
    if (enabled && workspaceAccessToken && state.view === 'workspace' && state.workspace.tab === serviceId){
      await loadWorkspaceTab(serviceId);
    } else {
      renderHomeTokenIndicator();
      if (state.view === 'workspace') renderWorkspaceView();
    }
  } catch (err) {
    toast(err.message || 'Failed to update service sync state', true);
    if (state.view === 'workspace') renderWorkspaceView();
  }
}

async function setAllServicesSync(enabled){
  try {
    await initFirebaseClient();
    if (!fbClient.user) return toast('Sign in with Google first to manage Firebase sync toggles.', true);
    await ensureUserProfileDoc(fbClient.user);
    await Promise.all(WORKSPACE_SERVICES.map(svc => updateServiceSyncRecord(svc.id, {
      enabled: Boolean(enabled),
      lastStatus: enabled ? 'idle' : 'paused'
    })));
    if (!enabled) state.workspace.data = {};
    toast(enabled ? 'All 6 Workspace services enabled' : 'All 6 Workspace services paused');
    renderHomeTokenIndicator();
    if (state.view === 'workspace') renderWorkspaceView();
  } catch (err) {
    toast(err.message || 'Failed to update services', true);
  }
}

async function fetchWorkspaceServiceData(serviceId){
  if (serviceId === 'drive') return wsApi('/api/workspace/drive/files');
  if (serviceId === 'gmail') return wsApi('/api/workspace/gmail/messages');
  if (serviceId === 'contacts') return wsApi('/api/workspace/contacts');
  if (serviceId === 'calendar') return wsApi('/api/workspace/calendar/events');
  if (serviceId === 'tasks') return wsApi('/api/workspace/tasks');
  if (serviceId === 'chat'){
    const sp = state.workspace.chatSpace ? ('?spaceName=' + encodeURIComponent(state.workspace.chatSpace)) : '';
    return wsApi('/api/workspace/chat/spaces' + sp);
  }
  return null;
}

async function syncSingleWorkspaceService(serviceId){
  if (!isServiceSyncEnabled(serviceId)){
    toast('Sync is paused for ' + serviceId + '. Enable its toggle first.', true);
    return;
  }
  if (!workspaceAccessToken){
    toast('Sign in with Google to sync ' + serviceId + '.', true);
    return;
  }
  if (fbClient.user) await updateServiceSyncRecord(serviceId, { enabled: true, lastStatus: 'syncing' }).catch(() => {});
  try {
    const data = await fetchWorkspaceServiceData(serviceId);
    state.workspace.data[serviceId] = data;
    if (fbClient.user){
      await updateServiceSyncRecord(serviceId, {
        enabled: true,
        lastStatus: 'synced',
        lastSyncedAt: new Date().toISOString()
      }).catch(() => {});
    }
    toast('Synced ' + serviceId);
  } catch (err) {
    if (fbClient.user) await updateServiceSyncRecord(serviceId, { enabled: true, lastStatus: 'error' }).catch(() => {});
    toast(err.message || ('Failed to sync ' + serviceId), true);
  }
  if (state.view === 'workspace') renderWorkspaceView();
}

async function syncAllEnabledServices(){
  if (!workspaceAccessToken) return toast('Sign in with Google to obtain an OAuth token first.', true);
  const active = WORKSPACE_SERVICES.filter(s => isServiceSyncEnabled(s.id));
  if (!active.length) return toast('All services are paused. Enable at least one service toggle.', true);
  state.workspace.loading = true;
  if (state.view === 'workspace') renderWorkspaceView();
  let okCount = 0;
  for (const svc of active){
    try {
      if (fbClient.user) await updateServiceSyncRecord(svc.id, { enabled: true, lastStatus: 'syncing' }).catch(() => {});
      state.workspace.data[svc.id] = await fetchWorkspaceServiceData(svc.id);
      if (fbClient.user) await updateServiceSyncRecord(svc.id, { enabled: true, lastStatus: 'synced', lastSyncedAt: new Date().toISOString() }).catch(() => {});
      okCount++;
    } catch {
      if (fbClient.user) await updateServiceSyncRecord(svc.id, { enabled: true, lastStatus: 'error' }).catch(() => {});
    }
  }
  state.workspace.loading = false;
  toast('Synced ' + okCount + '/' + active.length + ' enabled Workspace services');
  if (state.view === 'workspace') renderWorkspaceView();
}

function attachFirestoreListeners(uid){
  detachFirestoreListeners();
  const { fsMod } = fbClient.mods;
  const snapPath = 'users/' + uid + '/botSnapshots';
  const notePath = 'users/' + uid + '/workspaceNotes';
  const syncPath = 'users/' + uid + '/serviceSync';

  const qSnap = fsMod.query(
    fsMod.collection(fbClient.db, 'users', uid, 'botSnapshots'),
    fsMod.orderBy('createdAt', 'desc'),
    fsMod.limit(15)
  );
  fbClient.unsubs.push(fsMod.onSnapshot(qSnap, (qs) => {
    fbClient.snapshots = qs.docs.map(d => ({ id: d.id, ...d.data() }));
    if (state.view === 'workspace' && state.workspace.tab === 'firestore') renderWorkspaceView();
  }, (err) => {
    handleFirestoreError(err, OperationType.LIST, snapPath);
  }));

  const qNote = fsMod.query(
    fsMod.collection(fbClient.db, 'users', uid, 'workspaceNotes'),
    fsMod.orderBy('createdAt', 'desc'),
    fsMod.limit(20)
  );
  fbClient.unsubs.push(fsMod.onSnapshot(qNote, (qs) => {
    fbClient.notes = qs.docs.map(d => ({ id: d.id, ...d.data() }));
    if (state.view === 'workspace' && state.workspace.tab === 'firestore') renderWorkspaceView();
  }, (err) => {
    handleFirestoreError(err, OperationType.LIST, notePath);
  }));

  const qSync = fsMod.collection(fbClient.db, 'users', uid, 'serviceSync');
  fbClient.unsubs.push(fsMod.onSnapshot(qSync, (qs) => {
    const map = {};
    qs.docs.forEach(d => { map[d.id] = { id: d.id, ...d.data() }; });
    fbClient.serviceSync = map;
    fbClient.syncLoaded = true;
    renderHomeTokenIndicator();
    if (state.view === 'workspace') renderWorkspaceView();
  }, (err) => {
    handleFirestoreError(err, OperationType.LIST, syncPath);
  }));
}

async function signInWithGoogleWorkspace(){
  try {
    await initFirebaseClient();
    const { authMod } = fbClient.mods;
    const provider = new authMod.GoogleAuthProvider();
    WORKSPACE_SCOPES.forEach(s => provider.addScope(s));
    provider.setCustomParameters({ prompt: 'consent select_account' });
    const result = await authMod.signInWithPopup(fbClient.auth, provider);
    const credential = authMod.GoogleAuthProvider.credentialFromResult(result);
    workspaceAccessToken = credential && credential.accessToken ? credential.accessToken : '';
    if (workspaceAccessToken){
      const ttlSec = Math.max(60, Number(result && result._tokenResponse && result._tokenResponse.oauthExpireIn) || 3600);
      tokenMeta = {
        status: ttlSec <= 300 ? 'expiring_soon' : 'valid',
        valid: true,
        expiresAtMs: Date.now() + ttlSec * 1000,
        expiresIn: ttlSec,
        maxTtlSec: ttlSec,
        checkedAt: new Date().toISOString(),
        scopeCount: WORKSPACE_SCOPES.length,
        services: { drive: true, gmail: true, contacts: true, calendar: true, tasks: true, chat: true },
        reason: '',
        verifying: false,
        autoCheckedExpired: false
      };
    } else {
      resetTokenMeta();
    }
    fbClient.lastError = '';
    toast('Signed in with Google Workspace');
    if (workspaceAccessToken) await refreshTokenStatus(true);
    if (state.view === 'workspace'){
      if (isServiceSyncEnabled(state.workspace.tab)) await loadWorkspaceTab(state.workspace.tab);
      else renderWorkspaceView();
    }
  } catch (err) {
    const msg = err && err.message ? err.message : String(err);
    fbClient.lastError = msg;
    toast(msg, true);
    if (state.view === 'workspace') renderWorkspaceView();
  }
}

async function signOutGoogleWorkspace(){
  try {
    await initFirebaseClient();
    const { authMod } = fbClient.mods;
    resetTokenMeta();
    detachFirestoreListeners();
    await authMod.signOut(fbClient.auth);
    fbClient.serviceSync = {};
    fbClient.syncLoaded = false;
    state.workspace.data = {};
    toast('Signed out of Google Workspace');
    renderHomeTokenIndicator();
    if (state.view === 'workspace') renderWorkspaceView();
  } catch (err) { toast(err.message, true); }
}

async function saveBotSnapshotToFirestore(graph){
  try {
    await initFirebaseClient();
    if (!fbClient.user) {
      toast('Sign in with Google on the Workspace tab first to save Firestore snapshots.', true);
      setView('workspace');
      return;
    }
    const { fsMod } = fbClient.mods;
    const uid = fbClient.user.uid;
    const snapId = 'snap-' + Date.now().toString(36);
    const snapPath = 'users/' + uid + '/botSnapshots/' + snapId;
    const activeBots = (graph.nodes || []).filter(n => n.isActive).map(n => n.handle).slice(0, 7);
    const sm = graph.systemMetrics || {};
    const summaryText = `Cycle #${sm.cycleCount || 0} | CPU ${sm.cpuPercent ?? 0}% | RAM ${sm.ramPercent ?? 0}% | Media ${sm.mediaPercent ?? 0}% | Active: ${activeBots.join(', ') || 'none'}`.slice(0, 2000);
    await ensureUserProfileDoc(fbClient.user);
    try {
      await fsMod.setDoc(fsMod.doc(fbClient.db, 'users', uid, 'botSnapshots', snapId), {
        ownerId: uid,
        title: ('Fleet Snapshot · Cycle #' + (sm.cycleCount || 0)).slice(0, 160),
        summary: summaryText,
        activeBots,
        cycleCount: Math.max(0, Math.round(Number(sm.cycleCount) || 0)),
        status: 'active',
        createdAt: fsMod.serverTimestamp(),
        updatedAt: fsMod.serverTimestamp()
      });
      toast('Saved fleet snapshot to Firestore');
    } catch (err) {
      handleFirestoreError(err, OperationType.CREATE, snapPath);

  } catch (err) {

  }
}

async function wsApi(path, opts = {}){
  if (!workspaceAccessToken) throw new Error('Authorize with Sign in with Google to obtain a Workspace access token.');
  const join = path.includes('?') ? '&' : '?';
  const res = await fetch(path + join + 'token=' + encodeURIComponent(TOKEN), {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'X-Google-Access-Token': workspaceAccessToken,
      ...(opts.headers || {})
    }
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 401 && path !== '/api/workspace/token-status') {
      tokenMeta.valid = false;
      tokenMeta.status = 'expired';
      tokenMeta.reason = (data && data.error && (data.error.message || data.error)) || 'OAuth token rejected (401).';
      updateTokenIndicatorDom();
      renderHomeTokenIndicator();
    }
    const errMsg = (data && data.error && (data.error.message || data.error)) || res.statusText || 'Workspace request failed';
    const err = new Error(errMsg);
    err.status = res.status;
    throw err;
  }
  return data;
}

async function loadWorkspaceTab(tab){
  state.workspace.tab = tab;
  state.workspace.error = '';
  if (tab === 'firestore' || !workspaceAccessToken) {
    renderWorkspaceView();
    return;
  }
  if (!isServiceSyncEnabled(tab)) {
    state.workspace.loading = false;
    renderWorkspaceView();
    return;
  }
  state.workspace.loading = true;
  renderWorkspaceView();
  if (fbClient.user) updateServiceSyncRecord(tab, { enabled: true, lastStatus: 'syncing' }).catch(() => {});
  try {
    state.workspace.data[tab] = await fetchWorkspaceServiceData(tab);
    if (fbClient.user) updateServiceSyncRecord(tab, { enabled: true, lastStatus: 'synced', lastSyncedAt: new Date().toISOString() }).catch(() => {});
  } catch (err) {
    state.workspace.error = err.message || 'Workspace request failed.';
    if (fbClient.user) updateServiceSyncRecord(tab, { enabled: true, lastStatus: 'error' }).catch(() => {});
  } finally {
    state.workspace.loading = false;
    if (state.view === 'workspace') renderWorkspaceView();
  }
}

      list.append(row);
    });
    sBody.append(list);

    const form = el('form', 'bot-form');
    const sumInp = el('input'); sumInp.placeholder = 'Event title…'; sumInp.required = true;

    form.onsubmit = async e => {
      e.preventDefault();

        await wsApi('/api/workspace/calendar/events', { method: 'POST', body: JSON.stringify({ summary: sumInp.value.trim(), start: startInp.value || undefined, description: descInp.value.trim() }) });
        sumInp.value = ''; descInp.value = '';

      } catch (err) { toast(err.message, true); }

    const taskItems = (state.workspace.data.tasks && state.workspace.data.tasks.items) || [];
    const list = el('div', 'ws-list');
    if (!taskItems.length && !state.workspace.loading) list.append(el('div', 'empty-state', 'No Google Tasks found. Click Refresh or add one below.'));
    taskItems.forEach(tk => {
      const done = tk.status === 'completed';
      const row = el('div', 'ws-row');
      const main = el('div', 'ws-row-main');
      main.append(el('div', 'ws-row-title', (done ? '✓ ' : '') + (tk.title || 'Untitled task')));
      if (tk.notes) main.append(el('div', 'ws-row-sub', tk.notes));
      const toggleBtn = el('button', 'small-btn', done ? 'Reopen' : 'Complete');
      toggleBtn.onclick = async () => {
        const nextStatus = done ? 'needsAction' : 'completed';
        if (!await dialog('Update Task', 'Mark "' + tk.title + '" as ' + nextStatus + '?', 'Confirm', false)) return;
        try { await wsApi('/api/workspace/tasks', { method: 'PATCH', body: JSON.stringify({ id: tk.id, status: nextStatus }) }); toast('Task updated'); loadWorkspaceTab('tasks'); }
        catch (e) { toast(e.message, true); }
      };
      row.append(main, toggleBtn);
      list.append(row);
    });
    sBody.append(list);

    const form = el('form', 'bot-form');
    const titleInp = el('input'); titleInp.placeholder = 'New Google Task title…'; titleInp.required = true;
    const notesInp = el('input'); notesInp.placeholder = 'Task notes (optional)…';
    const addBtn = el('button', 'primary', 'Add Google Task'); addBtn.type = 'submit';
    form.append(titleInp, notesInp, addBtn);
    form.onsubmit = async e => {
      e.preventDefault();
      if (!await dialog('Create Google Task', 'Add "' + titleInp.value.trim() + '" to your Google Tasks list?', 'Add Task', false)) return;
      try {
        await wsApi('/api/workspace/tasks', { method: 'POST', body: JSON.stringify({ title: titleInp.value.trim(), notes: notesInp.value.trim() }) });
        titleInp.value = ''; notesInp.value = '';
        toast('Google Task created');
        loadWorkspaceTab('tasks');
      } catch (err) { toast(err.message, true); }
    };
    sBody.append(el('div', 'summary-section-label', 'Add Task'), form);
  } else if (tab === 'chat') {
    const note = el('div', 'ws-note-banner');
    note.append(el('div', '', 'Google Chat API requires a Business/Enterprise Google Workspace account (consumer @gmail.com accounts are unsupported) and a configured Chat app in Google Cloud Console (project gen-lang-client-0514443416).'));
    sBody.append(note);
    const chatData = state.workspace.data.chat || {};
    const spaces = chatData.spaces || [];
    const list = el('div', 'ws-list');
    if (!spaces.length && !state.workspace.loading) list.append(el('div', 'empty-state', 'No Google Chat spaces loaded.'));
    spaces.forEach(sp => {
      const row = el('div', 'ws-row');
      const main = el('div', 'ws-row-main');
      main.append(el('div', 'ws-row-title', sp.displayName || sp.name));
      main.append(el('div', 'ws-row-sub', (sp.spaceType || '') + ' · ' + sp.name));
      const openBtn = el('button', 'small-btn', 'Load');
      openBtn.onclick = () => { state.workspace.chatSpace = sp.name; loadWorkspaceTab('chat'); };
      row.append(main, openBtn);
      list.append(row);
    });
    sBody.append(list);

    if (state.workspace.chatSpace) {
      sBody.append(el('div', 'summary-section-label', 'Messages in ' + state.workspace.chatSpace));
      const msgList = el('div', 'ws-list');
      (chatData.messages || []).forEach(cm => {
        const row = el('div', 'ws-row');
        const main = el('div', 'ws-row-main');
        main.append(el('div', 'ws-row-title', (cm.sender && cm.sender.displayName) || 'Member'));
        main.append(el('div', 'ws-row-sub', cm.text || ''));
        row.append(main);
        msgList.append(row);
      });
      sBody.append(msgList);

      const form = el('form', 'bot-form');
      const txtInp = el('input'); txtInp.placeholder = 'Message to post in ' + state.workspace.chatSpace + '…'; txtInp.required = true;
      const sendBtn = el('button', 'primary', 'Post to Google Chat'); sendBtn.type = 'submit';
      form.append(txtInp, sendBtn);
      form.onsubmit = async e => {
        e.preventDefault();
        if (!await dialog('Post Google Chat Message', 'Post message to "' + state.workspace.chatSpace + '"?', 'Post Message', false)) return;
        try {
          await wsApi('/api/workspace/chat/messages', { method: 'POST', body: JSON.stringify({ spaceName: state.workspace.chatSpace, text: txtInp.value.trim() }) });
          txtInp.value = '';
          toast('Posted to Google Chat');
          loadWorkspaceTab('chat');
        } catch (err) { toast(err.message, true); }
      };
      sBody.append(form);
    }
  } else if (tab === 'firestore') {
    if (!uid) {
      sBody.append(el('div', 'empty-state', 'Sign in with Google above to sync your private Firestore Bot Snapshots & Workspace Digests.'));
    } else {
      const { fsMod } = fbClient.mods;
      sBody.append(el('div', 'summary-section-label', 'Bot Fleet Snapshots (' + fbClient.snapshots.length + ')'));
      const snapList = el('div', 'ws-list');
      if (!fbClient.snapshots.length) snapList.append(el('div', 'empty-state', 'No Firestore snapshots yet. Use "Save Snapshot" on the Bot Comms & Map tab.'));
      fbClient.snapshots.forEach(sn => {
        const row = el('div', 'ws-row');
        const main = el('div', 'ws-row-main');
        main.append(el('div', 'ws-row-title', sn.title + ' [' + sn.status + ']'));
        main.append(el('div', 'ws-row-sub', sn.summary));
        const acts = el('div', 'mon-badges');
        if (sn.status !== 'archived') {
          const archBtn = el('button', 'small-btn', 'Archive');
          archBtn.onclick = async () => {
            if (!await dialog('Archive Snapshot', 'Archive "' + sn.title + '"? Archived snapshots become read-only.', 'Archive', false)) return;
            const p = 'users/' + uid + '/botSnapshots/' + sn.id;
            try { await fsMod.updateDoc(fsMod.doc(fbClient.db, 'users', uid, 'botSnapshots', sn.id), { status: 'archived', updatedAt: fsMod.serverTimestamp() }); toast('Snapshot archived'); }
            catch (err) { handleFirestoreError(err, OperationType.UPDATE, p); }
          };
          acts.append(archBtn);
        }
        const delBtn = el('button', 'small-btn', 'Delete');
        delBtn.onclick = async () => {
          if (!await dialog('Delete Snapshot', 'Delete "' + sn.title + '" from Firestore?', 'Delete', true)) return;
          const p = 'users/' + uid + '/botSnapshots/' + sn.id;
          try { await fsMod.deleteDoc(fsMod.doc(fbClient.db, 'users', uid, 'botSnapshots', sn.id)); toast('Snapshot deleted'); }
          catch (err) { handleFirestoreError(err, OperationType.DELETE, p); }
        };
        acts.append(delBtn);
        row.append(main, acts);
        snapList.append(row);
      });
      sBody.append(snapList);

      sBody.append(el('div', 'summary-section-label', 'Pinned Workspace Digests (' + fbClient.notes.length + ')'));
      const noteList = el('div', 'ws-list');
      if (!fbClient.notes.length) noteList.append(el('div', 'empty-state', 'No pinned digests yet. Click "Pin" on any Drive, Gmail, Contact, or Calendar item.'));
      fbClient.notes.forEach(nt => {
        const row = el('div', 'ws-row');
        const main = el('div', 'ws-row-main');
        main.append(el('div', 'ws-row-title', '[' + nt.service + '] ' + nt.title + ' (' + nt.status + ')'));
        main.append(el('div', 'ws-row-sub', nt.content));
        const acts = el('div', 'mon-badges');
        if (nt.status !== 'completed') {
          const doneBtn = el('button', 'small-btn', 'Complete');
          doneBtn.onclick = async () => {
            if (!await dialog('Complete Digest', 'Mark "' + nt.title + '" as completed? Completed notes become read-only.', 'Complete', false)) return;
            const p = 'users/' + uid + '/workspaceNotes/' + nt.id;
            try { await fsMod.updateDoc(fsMod.doc(fbClient.db, 'users', uid, 'workspaceNotes', nt.id), { status: 'completed', updatedAt: fsMod.serverTimestamp() }); toast('Digest marked completed'); }
            catch (err) { handleFirestoreError(err, OperationType.UPDATE, p); }
          };
          acts.append(doneBtn);
        }
        const delBtn = el('button', 'small-btn', 'Delete');
        delBtn.onclick = async () => {
          if (!await dialog('Delete Digest', 'Delete "' + nt.title + '" from Firestore?', 'Delete', true)) return;
          const p = 'users/' + uid + '/workspaceNotes/' + nt.id;
          try { await fsMod.deleteDoc(fsMod.doc(fbClient.db, 'users', uid, 'workspaceNotes', nt.id)); toast('Digest deleted'); }
          catch (err) { handleFirestoreError(err, OperationType.DELETE, p); }
        };
        acts.append(delBtn);
        row.append(main, acts);
        noteList.append(row);
      });
      sBody.append(noteList);
    }
  }

  svcCard.append(sBody);
  wrap.append(svcCard);
  body.replaceChildren(wrap);
  body.scrollTop = prevScroll;
}

let facebookStateCache = null;
async function fetchFacebookStatus(){
  try {
    facebookStateCache = await api('/api/facebook/status');
  } catch {
    facebookStateCache = { linked: false, userId: '', notifications: [], threads: [], posts: [], chatHistory: [] };
  }
  return facebookStateCache;
}

function updateFacebookSilent(st){
  const badge = $('#fbStatusBadge');
  if (badge) {
    badge.className = 'pill-badge ' + (st.linked ? 'ok' : 'warn');
    badge.textContent = st.linked ? ('Linked (' + st.userId + ')') : 'Not Linked';
  }
  const reauth = $('#fbReauthBanner');
  if (reauth) reauth.hidden = !st.needsReauth;

  // Update chat history smoothly without resetting scroll or inputs
  const chatLog = $('#fbChatLog');
  if (chatLog) {
    const history = Array.isArray(st.chatHistory) ? st.chatHistory : [];
    const count = chatLog.querySelectorAll('.fb-msg').length;
    if (history.length !== count) {
      const nearBottom = chatLog.scrollHeight - chatLog.scrollTop - chatLog.clientHeight < 80;
      chatLog.replaceChildren();
      if (!history.length) chatLog.append(el('div', 'empty-state', 'No chat messages yet. Send a message or try command "!help".'));
      history.forEach(m => {
        const row = el('div', 'fb-msg ' + (m.role === 'bot' ? 'bot' : 'user'));
        const meta = el('div', 'fb-msg-meta', (m.sender || 'User') + ' [' + m.source + '] · ' + new Date(m.ts).toLocaleTimeString());
        row.append(meta, el('div', '', m.text));
        chatLog.append(row);
      });
      if (nearBottom) chatLog.scrollTop = chatLog.scrollHeight;
    }
  }

  // Update logs stream smoothly
  const logList = $('#fbLogList');
  if (logList) {
    const logs = Array.isArray(st.activityLogs) ? st.activityLogs : [];
    const logHeadTitle = $('#fbLogHeadTitle');
    if (logHeadTitle) logHeadTitle.textContent = 'Real-Time Activity & Log Stream (' + logs.length + ')';
    const count = logList.querySelectorAll('.ws-row').length;
    if (logs.length !== count) {
      logList.replaceChildren();
      if (!logs.length) {
        logList.append(el('div', 'empty-state', 'No log activity recorded yet.'));
      } else {
        logs.forEach(lg => {
          const row = el('div', 'ws-row');
          const main = el('div', 'ws-row-main');
          main.append(el('div', 'ws-row-title', '[' + lg.kind.toUpperCase() + '] ' + new Date(lg.ts).toLocaleTimeString()));
          main.append(el('div', 'ws-row-sub', lg.message));
          row.append(main);
          logList.append(row);
        });
      }
    }
  }

  // Update notifications header count
  const nHeadTitle = $('#fbNotifHeadTitle');
  if (nHeadTitle) nHeadTitle.textContent = 'Facebook Notifications (' + (st.notifications || []).length + ')';
}

async function renderFacebookView(silent = false){
  const body = $('#panelBody');
  const prevScroll = body ? body.scrollTop : 0;
  const st = await fetchFacebookStatus();
  if (state.view !== 'facebook') return;

  const existingWrap = $('#fbViewWrap');
  const activeEl = document.activeElement;
  const isTyping = Boolean(activeEl && body.contains(activeEl) && ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeEl.tagName));

  const fbSig = [
    st.linked, st.userId, st.needsReauth, st.lastError, st.profileName,
    (st.notifications || []).length, (st.notifications || []).map(n => n.id).slice(0, 3).join(','),
    (st.chatHistory || []).length, (st.chatHistory || []).slice(-1)[0]?.id,
    (st.posts || []).length, (st.posts || []).slice(0, 2).map(p => p.id).join(','),
    (st.activityLogs || []).length, (st.activityLogs || []).slice(0, 2).map(l => l.id).join(','),
    (st.quickReplies || []).length
  ].join('|');

  if (silent && state.lastFbSig === fbSig && existingWrap) return;
  state.lastFbSig = fbSig;

  if ((silent || isTyping) && existingWrap) {
    updateFacebookSilent(st);
    return;
  }

  const wrap = el('div', 'analytics-wrap');
  wrap.id = 'fbViewWrap';

  const reauthBanner = el('div', 'ws-error');
  reauthBanner.id = 'fbReauthBanner';
  reauthBanner.style.background = 'rgba(255, 77, 125, 0.15)';
  reauthBanner.style.borderColor = 'var(--danger)';
  reauthBanner.innerHTML = '<strong>Session Expired / Re-Authentication Required:</strong> Facebook appState cookie session has expired or hit a security checkpoint. Please paste updated appState JSON above to re-authenticate.';
  reauthBanner.hidden = !st.needsReauth;
  wrap.append(reauthBanner);

  const sessCard = el('div', 'settings-card analytics-card');
  const sHead = el('div', 'card-head-row');
  sHead.append(el('h3', '', 'Facebook Session & FCA / Zero Bot Config'));

  sBadges.append(statusBadge);
  sHead.append(sBadges);

  const sBody = el('div', 'card-body');
  if (st.lastError) sBody.append(el('div', 'ws-error', st.lastError));

  const linkForm = el('form', 'bot-form');
  const appStateInp = el('textarea');
  appStateInp.rows = 3;

  appStateInp.required = true;
  const linkBtn = el('button', 'primary', st.linked ? 'Update appState Session' : 'Connect Facebook appState');

  linkForm.onsubmit = async e => {
    e.preventDefault();
    try {
      const res = await api('/api/facebook/connect', { method: 'POST', body: JSON.stringify({ appState: appStateInp.value.trim() }) });
      toast(res.note || 'Facebook connected');
      renderFacebookView(false);

  };
  sBody.append(linkForm);

  if (st.linked){

  const threadSel = el('select', 'comms-select');
  threadSel.append(el('option', { value: '' }, 'Dashboard Console'));
  (st.threads || []).forEach(th => {
    const opt = el('option', { value: th.threadId }, th.name);
    if (th.threadId === state.fbSelectedThread) opt.selected = true;
    threadSel.append(opt);
  });
  threadSel.onchange = () => { state.fbSelectedThread = threadSel.value; };
  const sendFbCheck = el('label', 'ws-switch');
  const sendFbCb = el('input'); sendFbCb.type = 'checkbox'; sendFbCb.checked = Boolean(state.fbSendLive);
  sendFbCb.onchange = () => { state.fbSendLive = sendFbCb.checked; };
  sendFbCheck.append(sendFbCb, el('span', '', 'Send to Facebook Messenger'));

  const cAct = el('div', 'mon-badges');
  const sendBtn = el('button', 'primary', 'Send to Bot'); sendBtn.type = 'submit';
  cAct.append(threadSel, sendFbCheck, sendBtn);
  chatForm.append(msgInp, cAct);

  chatForm.onsubmit = async e => {
    e.preventDefault();
    try {
      await api('/api/facebook/chat', {
        method: 'POST',
        body: JSON.stringify({ message: msgInp.value.trim(), threadId: threadSel.value, sendToFacebook: sendFbCb.checked })
      });
      msgInp.value = '';
      renderFacebookView(true);
    } catch (err) { toast(err.message, true); }
  };
  cBody.append(chatForm);

  const chips = el('div', 'fb-chip-row');
  ['!help', '!status', '!notify', '!posts', '!ai Summarize Facebook updates'].forEach(cmd => {
    const chip = el('button', 'small-btn', cmd);
    chip.onclick = () => { msgInp.value = cmd; msgInp.focus(); };
    chips.append(chip);
  });
  cBody.append(chips);
  chatCard.append(cBody);
  wrap.append(chatCard);

  const notifCard = el('div', 'settings-card analytics-card');
  const nHead = el('div', 'card-head-row');
  const nHeadTitle = el('h3', '', 'Facebook Notifications (' + (st.notifications || []).length + ')');
  nHeadTitle.id = 'fbNotifHeadTitle';
  nHead.append(nHeadTitle);
  const fetchNotifBtn = el('button', 'small-btn', 'Fetch Notifications');
  fetchNotifBtn.onclick = async () => {
    try {
      const res = await api('/api/facebook/notifications/fetch', { method: 'POST', body: '{}' });
      toast('Fetched ' + res.notifications.length + ' notifications (' + res.newlyArrivedCount + ' new)');
      renderFacebookView(false);
    } catch (e) { toast(e.message, true); }
  };
  nHead.append(fetchNotifBtn);
  notifCard.append(nHead);

  const nBody = el('div', 'card-body');
  const notifList = el('div', 'ws-list');
  const notifs = Array.isArray(st.notifications) ? st.notifications : [];
  if (!notifs.length) notifList.append(el('div', 'empty-state', 'No notifications fetched yet. Connect appState and click Fetch Notifications.'));
  notifs.forEach(n => {
    const row = el('div', 'ws-row');
    const main = el('div', 'ws-row-main');
    main.append(el('div', 'ws-row-title', n.actor + (n.unread ? ' [Unread]' : '')));
    main.append(el('div', 'ws-row-sub', n.text + ' · ' + n.timeText));
    const acts = el('div', 'mon-badges');
    const tgBtn = el('button', 'small-btn', 'Forward to Telegram');
    tgBtn.onclick = async () => {
      try {
        await api('/api/facebook/notifications/telegram', { method: 'POST', body: JSON.stringify({ text: n.actor + ': ' + n.text }) });
        toast('Forwarded notification to Telegram');
      } catch (err) { toast(err.message, true); }
    };
    acts.append(tgBtn);
    row.append(main, acts);
    notifList.append(row);
  });
  nBody.append(notifList);
  notifCard.append(nBody);
  wrap.append(notifCard);

  const postCard = el('div', 'settings-card analytics-card');
  const pHead = el('div', 'card-head-row');
  pHead.append(el('h3', '', 'Facebook Post Manager (' + (st.posts || []).length + ')'));
  const fetchPostsBtn = el('button', 'small-btn', 'Fetch Posts');
  fetchPostsBtn.onclick = async () => {
    try { await api('/api/facebook/posts/fetch', { method: 'POST', body: '{}' }); toast('Fetched Facebook posts'); renderFacebookView(false); }
    catch (e) { toast(e.message, true); }
  };
  pHead.append(fetchPostsBtn);
  postCard.append(pHead);

  const pBody = el('div', 'card-body');
  const postForm = el('form', 'bot-form');
  const postTextInp = el('input'); postTextInp.placeholder = 'Compose Facebook post message…'; postTextInp.required = true;
  const privSel = el('select', 'comms-select');
  ['FRIENDS', 'SELF', 'EVERYONE'].forEach(p => privSel.append(el('option', { value: p }, p)));
  const liveCheck = el('label', 'ws-switch');
  const liveCb = el('input'); liveCb.type = 'checkbox'; liveCb.checked = true;
  liveCheck.append(liveCb, el('span', '', 'Publish Live (Selinah Guard)'));

  const pAct = el('div', 'mon-badges');
  const postBtn = el('button', 'primary', 'Publish Post'); postBtn.type = 'submit';
  pAct.append(privSel, liveCheck, postBtn);
  postForm.append(postTextInp, pAct);

  postForm.onsubmit = async e => {
    e.preventDefault();
    if (liveCb.checked && !await dialog('Publish Facebook Post', 'Publish post live to Facebook via mbasic composer? Gate-checked by bot-selinah.', 'Publish', false)) return;
    try {
      await api('/api/facebook/posts', {
        method: 'POST',
        body: JSON.stringify({ message: postTextInp.value.trim(), privacy: privSel.value, publishLive: liveCb.checked })
      });
      postTextInp.value = '';
      toast('Post published / created');
      renderFacebookView(false);
    } catch (err) { toast(err.message, true); }
  };
  pBody.append(postForm);

  const postList = el('div', 'ws-list');
  const posts = Array.isArray(st.posts) ? st.posts : [];
  if (!posts.length) postList.append(el('div', 'empty-state', 'No posts managed or cached yet.'));
  posts.forEach(pt => {
    const row = el('div', 'fb-post-card');
    const top = el('div', 'ws-row-main');
    top.append(el('div', 'ws-row-title', '[' + pt.id + '] (' + pt.privacy + ' - ' + pt.source + ')'));
    top.append(el('div', 'ws-row-sub', pt.message));
    row.append(top);

    const rxRow = el('div', 'fb-chip-row');
    ['LIKE', 'LOVE', 'HAHA', 'WOW', 'SAD'].forEach(rx => {
      const btn = el('button', 'fb-rx-btn' + (pt.reaction === rx ? ' active' : ''), rx);
      btn.onclick = async () => {
        await api('/api/facebook/posts/react', { method: 'POST', body: JSON.stringify({ postId: pt.id, reaction: rx }) });
        toast('Reacted ' + rx);
        renderFacebookView(true);
      };
      rxRow.append(btn);
    });
    row.append(rxRow);

    const commForm = el('form', 'bot-form');
    const commInp = el('input'); commInp.placeholder = 'Write a comment…'; commInp.required = true;
    const commBtn = el('button', 'small-btn', 'Comment'); commBtn.type = 'submit';
    commForm.append(commInp, commBtn);
    commForm.onsubmit = async e => {
      e.preventDefault();
      try {
        await api('/api/facebook/posts/comment', { method: 'POST', body: JSON.stringify({ postId: pt.id, comment: commInp.value.trim() }) });
        commInp.value = '';
        toast('Comment added');
        renderFacebookView(true);
      } catch (err) { toast(err.message, true); }
    };
    row.append(commForm);

    if (Array.isArray(pt.comments) && pt.comments.length){
      const cBox = el('div', 'ws-scope-list');
      pt.comments.forEach(cm => cBox.append(el('div', '', '• ' + cm.author + ': ' + cm.text)));
      row.append(cBox);
    }

    const delPostBtn = el('button', 'small-btn', 'Delete Post');
    delPostBtn.onclick = async () => {
      if (!await dialog('Delete Post', 'Delete post ' + pt.id + '?', 'Delete', true)) return;
      try {
        await api('/api/facebook/posts', { method: 'DELETE', body: JSON.stringify({ postId: pt.id }) });
        toast('Post deleted');
        renderFacebookView(false);
      } catch (err) { toast(err.message, true); }
    };
    row.append(delPostBtn);

    postList.append(row);
  });
  pBody.append(postList);
  postCard.append(pBody);
  wrap.append(postCard);

  /* Real-Time Activity & Log Stream Card */
  const logCard = el('div', 'settings-card analytics-card');
  const lHead = el('div', 'card-head-row');
  const lHeadTitle = el('h3', '', 'Real-Time Activity & Log Stream (' + (st.activityLogs || []).length + ')');
  lHeadTitle.id = 'fbLogHeadTitle';
  lHead.append(lHeadTitle);
  const clearLogsBtn = el('button', 'small-btn', 'Clear Logs');
  clearLogsBtn.onclick = async () => {
    await api('/api/facebook/logs/clear', { method: 'POST', body: '{}' });
    toast('Facebook activity logs cleared');
    renderFacebookView(false);
  };
  lHead.append(clearLogsBtn);
  logCard.append(lHead);

  const lBody = el('div', 'card-body');
  const logList = el('div', 'ws-list');
  logList.id = 'fbLogList';
  const logs = Array.isArray(st.activityLogs) ? st.activityLogs : [];
  if (!logs.length) {
    logList.append(el('div', 'empty-state', 'No log activity recorded yet.'));
  } else {
    logs.forEach(lg => {
      const row = el('div', 'ws-row');
      const main = el('div', 'ws-row-main');
      main.append(el('div', 'ws-row-title', '[' + lg.kind.toUpperCase() + '] ' + new Date(lg.ts).toLocaleTimeString()));
      main.append(el('div', 'ws-row-sub', lg.message));
      row.append(main);
      logList.append(row);
    });
  }
  lBody.append(logList);
  logCard.append(lBody);
  wrap.append(logCard);

  body.replaceChildren(wrap);
  if (silent) body.scrollTop = prevScroll;
}

/* ---------- views ---------- */
function setView(view){
  state.view = view;
  closeMenu(); closeReactionBar(); closeEmojiSheet(); closeDrawer(); closeNewChat();
  $$('.rail-item, .bn-item').forEach(node => node.classList.toggle('active', node.dataset.nav === view));
  $('#app')?.classList.toggle('wide-panel', ['monitor', 'bots', 'botcomms', 'workspace', 'facebook'].includes(view));
  const titles = { chats: 'Chats', status: 'Status', starred: 'Starred messages', analytics: 'Analytics', monitor: 'System Monitor', bots: 'Bot Command Center', botcomms: 'Bot Comms & Dependency Map', workspace: 'Google Workspace', facebook: 'Facebook Bot (Zero & FCA)', settings: 'Settings' };
  $('#panelTitle').textContent = titles[view] || 'Chats';
  $('#panelTools').style.display = ['settings', 'analytics', 'monitor', 'bots', 'botcomms', 'workspace', 'facebook'].includes(view) ? 'none' : 'flex';
  $('#chatFilters').style.display = view === 'chats' ? 'flex' : 'none';
  $('#newChatBtn').hidden = view !== 'chats';
  $('#panelMenuBtn').hidden = view !== 'chats';
  $('#fab').hidden = view !== 'chats';
  if (view === 'chats') renderChatList();
  else if (view === 'status') loadStatuses();
  else if (view === 'starred') renderStarredView();
  else if (view === 'analytics') renderAnalyticsView();
  else if (view === 'monitor') renderMonitorView(false);
  else if (view === 'bots') renderBotsView(false);
  else if (view === 'botcomms') renderBotCommsView(false);
  else if (view === 'workspace') renderWorkspaceView();
  else if (view === 'facebook') renderFacebookView(false);
  else if (view === 'settings') renderSettingsView();
  const body = $('#panelBody');
  body.classList.remove('view-enter');
  void body.offsetWidth;
  body.classList.add('view-enter');
}

/* ---------- chat header menu ---------- */
function chatHeaderMenu(x, y){
  const jid = state.selected;
  const chat = state.selectedChat;
  if (!jid || !chat) return;
  const muted = state.prefs.muted.includes(jid);
  const archived = state.prefs.archived.includes(jid);
  const kind = chatType(chat);
  openMenu([
    { label: kind === 'group' ? 'Group info' : kind === 'channel' ? 'Channel info' : 'Contact info', icon: 'info', action: openDrawer },
    { label: 'Search in chat', icon: 'search', action: openFindBar },
    { label: 'Export chat history', icon: 'export', action: () => window.open('/api/export?jid=' + encodeURIComponent(jid) + '&token=' + encodeURIComponent(TOKEN), '_blank') },
    { label: muted ? 'Unmute notifications' : 'Mute notifications', icon: 'mute', action: () => savePrefs({ action: muted ? 'unmute' : 'mute', jid }).then(loadChats) },
    { label: archived ? 'Unarchive chat' : 'Archive chat', icon: 'archive', action: () => savePrefs({ action: archived ? 'unarchive' : 'archive', jid }).then(() => { loadChats(); closeChat(); }) },
    { label: 'Close chat', icon: 'close', action: closeChat }
  ], x, y);
}
function panelMenu(x, y){
  const archivedCount = state.chats.filter(c => c.archived).length;
  openMenu([
    { label: 'Archived chats' + (archivedCount ? ' (' + archivedCount + ')' : ''), icon: 'archive', action: () => { state.showArchived = true; renderChatList(); } },
    { label: 'Refresh chats', icon: 'down', action: () => { loadChats(); toast('Chats refreshed'); } },
    { label: 'Settings', icon: 'settings', action: () => setView('settings') }
  ], x, y);
}
