.comms-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.comms-filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.comms-select{border:1px solid var(--line);background:var(--input);border-radius:999px;padding:5px 11px;font-size:12px;outline:none}
.comms-stream{display:flex;flex-direction:column;gap:7px;max-height:460px;overflow-y:auto;padding-right:2px}
.comms-row{background:var(--input);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;line-height:1.45;overflow-wrap:anywhere}
.comms-row-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.comms-who{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:700}
.comms-dot{width:9px;height:9px;border-radius:50%;flex:none}
.comms-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;border:1px solid var(--line);background:var(--panel-bg);color:var(--muted)}
.comms-tag.thought{color:#5be7ff;border-color:rgba(91,231,255,.4)}
.comms-tag.bus{color:#b46bff;border-color:rgba(180,107,255,.45)}
.comms-tag.moderation{color:#ff4d7d;border-color:rgba(255,77,125,.45)}
.comms-tag.action{color:#00e9a5;border-color:rgba(0,233,165,.45)}
.comms-time{font-size:11px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.ws-tabs{display:flex;flex-wrap:wrap;gap:6px}
.ws-list{display:flex;flex-direction:column;gap:7px;max-height:340px;overflow-y:auto}
.ws-row{background:var(--input);border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;font-size:12.5px;line-height:1.4}
.ws-row-main{flex:1;min-width:0;overflow-wrap:anywhere}
.ws-row-title{font-weight:700;font-size:13px}
.ws-row-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.ws-error{padding:10px 12px;border-radius:10px;background:rgba(255,77,125,.12);border:1px solid rgba(255,77,125,.45);color:#ff9ab5;font-size:12.5px;line-height:1.45}
html[data-theme="light"] .ws-error{color:#9f1239}
.ws-note-banner{padding:10px 12px;border-radius:10px;background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.4);color:#ffd166;font-size:12px;line-height:1.45}
html[data-theme="light"] .ws-note-banner{color:#92400e}
.ws-token-panel{background:var(--input);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ws-token-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ws-countdown-val{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:20px;font-weight:800;letter-spacing:.06em;color:var(--text)}
.ws-token-track{height:7px;border-radius:999px;background:var(--panel-bg);border:1px solid var(--line);overflow:hidden}
.ws-token-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#00e9a5,#5be7ff);transition:width .4s ease}
.ws-token-fill.warn{background:linear-gradient(90deg,#ffd166,#ff8b00)}
.ws-token-fill.danger{background:#ff4d7d}
.ws-sync-grid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:900px){.ws-sync-grid{grid-template-columns:1fr 1fr}}
.ws-svc-card{background:var(--input);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;transition:border-color .18s}
.ws-svc-card.paused{opacity:.78}
.ws-svc-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ws-svc-title{font-weight:700;font-size:13.5px}
.ws-svc-desc{font-size:11.5px;color:var(--muted)}
.ws-switch{position:relative;display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-size:11.5px;font-weight:600;color:var(--muted)}
.ws-switch input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:999px;background:var(--panel-bg);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .18s,border-color .18s;flex:none}
.ws-switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .18s,background .18s}
.ws-switch input:checked{background:rgba(0,233,165,.22);border-color:rgba(0,233,165,.6)}
.ws-switch input:checked::after{transform:translateX(16px);background:#00e9a5}
.ws-home-token{width:100%;max-width:660px;background:var(--panel-bg);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow);position:relative;z-index:1;text-align:left}
.ws-monitor-box{background:var(--input);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.ws-refresh-alert{background:rgba(255,209,102,.14);border:1px solid rgba(255,209,102,.48);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px}
.ws-scope-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:900px){.ws-scope-grid{grid-template-columns:1fr 1fr}}
.ws-scope-card{background:var(--input);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:8px}
.ws-scope-list{max-height:135px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:6px;background:var(--panel-bg);border:1px solid var(--line);border-radius:8px;font-size:11px}
.ws-scope-item{display:flex;align-items:center;gap:6px;cursor:pointer;word-break:break-all;color:var(--text)}
.fb-chat-log{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;padding:8px;background:var(--panel-bg);border:1px solid var(--line);border-radius:10px}
.fb-msg{padding:8px 11px;border-radius:10px;font-size:12.5px;line-height:1.45;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere}
.fb-msg.user{align-self:flex-end;background:rgba(24,119,242,.18);border:1px solid rgba(24,119,242,.4)}
.fb-msg.bot{align-self:flex-start;background:var(--input);border:1px solid var(--line)}
.fb-msg-meta{font-size:10.5px;color:var(--muted);margin-bottom:2px}
.fb-post-card{background:var(--input);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:8px}
.fb-chip-row{display:flex;flex-wrap:wrap;gap:6px}
.fb-rx-btn{border:1px solid var(--line);background:var(--panel-bg);color:var(--text);border-radius:999px;padding:3px 9px;font-size:11px;cursor:pointer}
.fb-rx-btn.active{border-color:#1877f2;background:rgba(24,119,242,.2);color:#7eb6ff;font-weight:700}

/* Official Google Sign-In Material Button */
.gsi-material-button {
  -moz-user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
  -webkit-appearance: none;
  background-color: WHITE;
  background-image: none;
  border: 1px solid #747775;

  border-radius: 4px;

  box-sizing: border-box;
  color: #1f1f1f;
  cursor: pointer;
  font-family: 'Roboto', arial, sans-serif;
  font-size: 14px;
  height: 40px;
  letter-spacing: 0.25px;
  outline: none;
  overflow: hidden;
  padding: 0 12px;
  position: relative;
  text-align: center;
  -webkit-transition: background-color .218s, border-color .218s, box-shadow .218s;
  transition: background-color .218s, border-color .218s, box-shadow .218s;
  vertical-align: middle;
  white-space: nowrap;
  width: auto;
  max-width: 400px;
  min-width: min-content;
}
.gsi-material-button .gsi-material-button-icon { height: 20px; margin-right: 10px; min-width: 20px; width: 20px; }
.gsi-material-button .gsi-material-button-content-wrapper { -webkit-align-items: center; align-items: center; display: flex; -webkit-flex-direction: row; flex-direction: row; -webkit-flex-wrap: nowrap; flex-wrap: nowrap; height: 100%; justify-content: space-between; position: relative; width: 100%; }
.gsi-material-button .gsi-material-button-contents { -webkit-flex-grow: 1; flex-grow: 1; font-family: 'Roboto', arial, sans-serif; font-weight: 500; overflow: hidden; text-overflow: ellipsis; vertical-align: top; }
.gsi-material-button .gsi-material-button-state { -webkit-transition: opacity .218s; transition: opacity .218s; bottom: 0; left: 0; opacity: 0; position: absolute; right: 0; top: 0; }
.gsi-material-button:disabled { cursor: default; background-color: #ffffff61; border-color: #1f1f1f1f; }
.gsi-material-button:disabled .gsi-material-button-contents { opacity: 38%; }
.gsi-material-button:disabled .gsi-material-button-icon { opacity: 38%; }
.gsi-material-button:not(:disabled):active .gsi-material-button-state,
.gsi-material-button:not(:disabled):focus .gsi-material-button-state { background-color: #303030; opacity: 12%; }
.gsi-material-button:not(:disabled):hover { -webkit-box-shadow: 0 1px 2px 0 rgba(60, 64, 67, .30), 0 1px 3px 1px rgba(60, 64, 67, .15); box-shadow: 0 1px 2px 0 rgba(60, 64, 67, .30), 0 1px 3px 1px rgba(60, 64, 67, .15); }
.gsi-material-button:not(:disabled):hover .gsi-material-button-state { background-color: #303030; opacity: 8%; }

@media (max-width:700px){
  .version-chip{display:none}
  .conversation::before{filter:blur(16px)}
  .bottom-nav{overflow-x:auto;scrollbar-width:none}
  .bottom-nav::-webkit-scrollbar{display:none}
  .bn-item{min-width:54px;font-size:10px}
  .sched-grid,.bot-row-2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</head>
<body>
<div class="app" id="app">
  <nav class="rail" aria-label="Navigation">
    <div class="rail-logo" title="Montra"><img src="/assets/montra.svg" alt="Montra"></div>
    <button class="rail-item active" data-nav="chats" title="Chats" aria-label="Chats"><span data-icon="chat"></span></button>
    <button class="rail-item" data-nav="status" title="Status" aria-label="Status"><span data-icon="status"></span></button>
    <button class="rail-item" data-nav="starred" title="Starred messages" aria-label="Starred messages"><span data-icon="star"></span></button>
    <button class="rail-item" data-nav="analytics" title="Analytics" aria-label="Analytics"><span data-icon="chart"></span></button>
    <button class="rail-item" data-nav="monitor" title="System monitor" aria-label="System monitor"><span data-icon="activity"></span></button>
    <button class="rail-item" data-nav="bots" title="Bot command center" aria-label="Bot command center"><span data-icon="bot"></span></button>
    <button class="rail-item" data-nav="botcomms" title="Bot Comms &amp; Dependency Map" aria-label="Bot Comms &amp; Dependency Map"><span data-icon="network"></span></button>
    <button class="rail-item" data-nav="facebook" title="Facebook Bot (Zero / FCA)" aria-label="Facebook Bot"><span data-icon="facebook"></span></button>
    <button class="rail-item" data-nav="workspace" title="Google Workspace &amp; Cloud" aria-label="Google Workspace &amp; Cloud"><span data-icon="workspace"></span></button>
    <button class="rail-item" data-nav="settings" title="Settings" aria-label="Settings"><span data-icon="settings"></span></button>
    <div class="rail-spacer"></div>
    <button class="rail-avatar" id="railAvatar" title="Profile"><span class="avatar" id="railAvatarInner">M</span></button>
  </nav>

  <section class="panel">
    <header class="panel-head">
      <div class="panel-title" id="panelTitle">Chats</div>
      <span class="version-chip" title="Montra {{VERSION}}">{{VERSION}}</span>
      <div class="panel-actions">
        <button class="icon-btn" id="newChatBtn" title="New chat" aria-label="New chat"><span data-icon="newchat"></span></button>
        <button class="icon-btn" id="panelMenuBtn" title="Menu" aria-label="Menu"><span data-icon="menu"></span></button>
      </div>
    </header>
    <div class="panel-tools" id="panelTools">
      <div class="search-box"><span data-icon="search"></span><input id="chatSearch" type="search" placeholder="Search or start a new chat" autocomplete="off" aria-label="Search chats"></div>
      <div class="filters" id="chatFilters">
        <button class="filter-pill active" data-filter="all">All</button>
        <button class="filter-pill" data-filter="unread">Unread</button>
        <button class="filter-pill" data-filter="chats">Chats</button>
        <button class="filter-pill" data-filter="groups">Groups</button>
        <button class="filter-pill" data-filter="channels">Channels</button>
      </div>
    </div>
    <div class="panel-body" id="panelBody"></div>
    <div class="new-chat" id="newChatPanel">
      <div class="nc-head">
        <button class="icon-btn" id="newChatBack" title="Back" aria-label="Back"><span data-icon="back"></span></button>
        <h2>New chat</h2>
      </div>
      <div class="panel-tools">
        <div class="search-box"><span data-icon="search"></span><input id="contactSearch" type="search" placeholder="Search contacts" autocomplete="off" aria-label="Search contacts"></div>
      </div>
      <div class="new-contact-row">
        <div class="new-contact-form">
          <input id="newContactPhone" type="tel" placeholder="Phone number with country code" autocomplete="off">
          <button class="nc-add-btn" id="newContactAdd">Add</button>
        </div>
      </div>
      <div class="panel-body" id="contactList"></div>
    </div>
  </section>

  <section class="conversation" id="conversation">
    <div class="conversation-placeholder" id="conversationPlaceholder">
      <div class="ph-icon" id="phIcon" data-icon="lock-big"></div>
      <h2 id="phTitle">Montra Dashboard</h2>
      <p id="phSubtitle">Select a chat to view synced history and send messages from your linked WhatsApp account.</p>
      <div id="linkAccountSlot" style="width:100%;display:flex;justify-content:center" hidden></div>
      <div id="dailySummarySlot" style="width:100%;display:flex;justify-content:center"></div>
      <div id="workspaceStatusSlot" style="width:100%;display:flex;justify-content:center"></div>
      <footer><span data-icon="lock"></span> Your personal messages are end-to-end encrypted and stay on this device.</footer>
      <div class="ph-version">{{VERSION}} · splash edition</div>
    </div>
    <div class="conversation-inner hidden" id="conversationInner" style="display:flex;flex-direction:column;min-height:0;flex:1">
      <header class="conversation-head">
        <button class="icon-btn mobile-only" id="chatBack" title="Back" aria-label="Back to chats"><span data-icon="back"></span></button>
        <button class="chat-avatar-btn" id="chatAvatarBtn" title="Contact info" style="border-radius:50%"><span class="avatar" id="convAvatar"></span></button>
        <div class="conv-title-wrap" id="convTitleWrap">
          <div class="conv-title" id="convTitle"></div>
          <div class="conv-sub" id="convSub"></div>
        </div>
        <button class="icon-btn" id="findBtn" title="Search in chat" aria-label="Search in chat"><span data-icon="search"></span></button>
        <button class="icon-btn" id="chatMenuBtn" title="Menu" aria-label="Chat menu"><span data-icon="menu"></span></button>
      </header>
      <div class="find-bar" id="findBar" hidden>
        <input id="findInput" placeholder="Find…" autocomplete="off" aria-label="Find in chat">
        <span class="find-count" id="findCount"></span>
        <button class="icon-btn" id="findPrev" title="Previous match" aria-label="Previous"><span data-icon="up"></span></button>
        <button class="icon-btn" id="findNext" title="Next match" aria-label="Next"><span data-icon="down"></span></button>
        <button class="icon-btn" id="findClose" title="Close search" aria-label="Close search"><span data-icon="close"></span></button>
      </div>
      <div class="messages-wrap">
        <div class="wallpaper" id="wallpaper"></div>
        <div class="messages" id="messages"></div>
        <button class="scroll-fab" id="scrollFab" hidden title="Scroll to bottom"><span data-icon="down"></span><span class="fab-count" id="scrollFabCount" hidden></span></button>
      </div>
      <div class="connection-strip" id="connectionStrip" hidden><span data-icon="plug"></span><span id="connectionText"></span></div>
      <div class="reply-banner" id="replyBanner" hidden>
        <span class="reply-bar"></span>
        <div class="reply-info"><div class="reply-label" id="replyLabel"></div><div class="reply-text" id="replyText"></div></div>
        <button class="icon-btn" id="replyCancel" title="Cancel reply" aria-label="Cancel reply"><span data-icon="close"></span></button>
      </div>
      <div class="pending-banner" id="pendingBanner" hidden>
        <span class="pending-icon" id="pendingIcon"></span>
        <div class="pending-info"><div class="pending-label" id="pendingLabel"></div><div class="pending-name" id="pendingName"></div><input class="pending-caption" id="pendingCaption" placeholder="Add a caption…" aria-label="Caption"></div>
        <button class="icon-btn" id="pendingCancel" title="Cancel" aria-label="Cancel attachment"><span data-icon="close"></span></button>
        <button class="icon-btn" id="pendingSend" title="Send" aria-label="Send attachment"><span data-icon="send"></span></button>
      </div>
      <div class="chat-notice" id="chatNotice" hidden></div>
      <form class="composer" id="composer" style="position:relative">
        <button type="button" class="icon-btn" id="emojiBtn" title="Emoji" aria-label="Emoji"><span data-icon="emoji"></span></button>
        <button type="button" class="icon-btn" id="attachBtn" title="Attach" aria-label="Attach"><span data-icon="attach"></span></button>
        <textarea id="messageInput" rows="1" maxlength="4000" placeholder="Type a message" aria-label="Type a message" disabled></textarea>
        <button class="icon-btn send-btn" id="sendBtn" type="submit" disabled aria-label="Send"></button>
        <div class="attach-menu" id="attachMenu" hidden>
          <button class="attach-item" id="attachPhoto"><span class="ai-icon ai-photo" data-icon="image"></span>Photos &amp; videos</button>
          <button class="attach-item" id="attachDoc"><span class="ai-icon ai-doc" data-icon="doc"></span>Document</button>
          <button class="attach-item" id="attachArchive"><span class="ai-icon ai-archive" data-icon="archive"></span>Archived media</button>
        </div>
      </form>
      <input type="file" id="mediaInput" hidden accept="image/*,video/mp4">
      <input type="file" id="docInput" hidden>
    </div>
  </section>

  <aside class="drawer" id="drawer"></aside>

  <nav class="bottom-nav" id="bottomNav">
    <button class="bn-item active" data-nav="chats"><span data-icon="chat"></span>Chats</button>
    <button class="bn-item" data-nav="status"><span data-icon="status"></span>Status</button>
    <button class="bn-item" data-nav="starred"><span data-icon="star"></span>Starred</button>
    <button class="bn-item" data-nav="analytics"><span data-icon="chart"></span>Stats</button>
    <button class="bn-item" data-nav="monitor"><span data-icon="activity"></span>Monitor</button>
    <button class="bn-item" data-nav="bots"><span data-icon="bot"></span>Bots</button>
    <button class="bn-item" data-nav="botcomms"><span data-icon="network"></span>Comms</button>
    <button class="bn-item" data-nav="facebook"><span data-icon="facebook"></span>Facebook</button>
    <button class="bn-item" data-nav="workspace"><span data-icon="workspace"></span>Workspace</button>
    <button class="bn-item" data-nav="settings"><span data-icon="settings"></span>Settings</button>
  </nav>
  <button class="fab" id="fab" title="New chat" aria-label="New chat"><span data-icon="newchat"></span></button>
</div>

<div id="statusViewer" class="status-viewer" hidden></div>
<div id="mediaViewer" class="media-viewer" hidden></div>
<div id="contextMenu" class="context-menu" hidden></div>
<div id="reactionBar" class="reaction-bar" hidden></div>
<div id="emojiSheet" class="emoji-sheet" hidden></div>
<div id="lockScreen" class="lock-screen" hidden></div>
<div id="dialogOverlay" class="overlay" hidden></div>
<div id="firestoreDiagnosticOverlay" class="firestore-diagnostic-overlay" style="position:fixed;bottom:20px;right:20px;z-index:9999;background:var(--panel-bg,#1e1e1e);border:1px solid var(--line,#333);border-radius:12px;padding:12px 16px;box-shadow:0 4px 16px rgba(0,0,0,0.3);max-width:320px;font-size:13px;color:var(--text,#fff);" hidden>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
    <strong>Firestore Diagnostic</strong>
    <button class="small-btn" onclick="$('#firestoreDiagnosticOverlay').hidden = true">✕</button>
  </div>
  <div id="firestoreDiagnosticStatus" style="margin-bottom:8px;">Checking Firestore state...</div>
  <button class="primary small-btn" id="firestoreRetryBtn" style="width:100%;">Retry Connection</button>
</div>
<div id="toasts"></div>

}

}

function api(path, opts = {}){
  const join = path.includes('?') ? '&' : '?';
  return fetch(path + join + 'token=' + encodeURIComponent(TOKEN), { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } })
    .then(async response => {
      const data = await response.json().catch(() => ({}));
      if (response.status === 401){
        showTokenScreen();
        throw Error('Dashboard token required.');
      }
      if (response.status === 423){
        showLockScreen(data);
        throw Error(data.error || 'Montra is locked.');
      }
      if (!response.ok) throw Error(data.error || response.statusText);
      return data;
    });
}

function showLockScreen(status = {}){
  const overlay = $('#lockScreen');
  if (!overlay || !overlay.hidden) return;
  overlay.replaceChildren();
  const card = el('div', 'lock-card');
  card.append(icon('lock-big'));
  card.append(el('h2', '', 'Montra is locked'));
  card.append(el('p', 'lock-sub', status.lockReason || 'Both the dashboard and the Telegram bridge are locked for security.'));
  const pinInput = el('input', 'lock-pin');
  pinInput.type = 'password';
  pinInput.inputMode = 'numeric';
  pinInput.autocomplete = 'off';
  pinInput.placeholder = 'Security PIN';
  const unlockBtn = el('button', 'primary', 'Unlock');
  unlockBtn.type = 'button';
  const message = el('div', 'lock-msg', '');
  const note = el('div', 'lock-note', 'Use /start <PIN> in Telegram, or enter the PIN here. Five wrong attempts pause unlocking for 60 seconds.');
  const submit = async () => {
    const pin = pinInput.value.trim();
    if (!pin){ message.textContent = 'Enter the security PIN.'; return; }
    unlockBtn.disabled = true;
    message.textContent = 'Checking…';
    try {
      const response = await fetch('/api/security/unlock?token=' + encodeURIComponent(TOKEN), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw Error(data.error || 'Incorrect security PIN.');
      overlay.hidden = true;
      overlay.replaceChildren();
      toast('Montra unlocked');
      await refreshAfterUnlock();
    } catch (e) {
      message.textContent = e.message;
      pinInput.value = '';
      pinInput.focus();
      unlockBtn.disabled = false;
    }
  };
  unlockBtn.onclick = submit;
  pinInput.onkeydown = e => { if (e.key === 'Enter') submit(); };
  if (status.isLocked === false){ overlay.hidden = true; return; }
  card.append(pinInput, unlockBtn, message, note);
  overlay.append(card);
  overlay.hidden = false;
  setTimeout(() => pinInput.focus(), 60);
}
function showTokenScreen(){
  const overlay = $('#lockScreen');
  if (!overlay) return;
  overlay.replaceChildren();
  const card = el('div', 'lock-card');
  card.append(icon('lock-big'));
  card.append(el('h2', '', 'Dashboard Token Required'));
  card.append(el('p', 'lock-sub', 'Enter your DASHBOARD_TOKEN (or open this page with ?token=...) to access Montra.'));
  const tokenInput = el('input', 'lock-pin');
  tokenInput.type = 'password';
  tokenInput.autocomplete = 'off';
  tokenInput.placeholder = 'Dashboard token';
  const submitBtn = el('button', 'primary', 'Continue');
  submitBtn.type = 'button';
  const message = el('div', 'lock-msg', '');
  const submit = async () => {
    const val = tokenInput.value.trim();
    if (!val){ message.textContent = 'Enter your dashboard token.'; return; }
    submitBtn.disabled = true;
    message.textContent = 'Verifying…';
    try {
      const response = await fetch('/api/security?token=' + encodeURIComponent(val));
      if (response.status === 401) throw Error('Invalid dashboard token.');
      const status = await response.json().catch(() => ({}));
      TOKEN = val;
      overlay.hidden = true;
      overlay.replaceChildren();
      if (response.ok && status.isLocked){ showLockScreen(status); return; }
      toast('Dashboard unlocked');
      await refreshAfterUnlock();
    } catch (e) {
      message.textContent = e.message;
      tokenInput.value = '';
      tokenInput.focus();
      submitBtn.disabled = false;
    }
  };
  submitBtn.onclick = submit;
  tokenInput.onkeydown = e => { if (e.key === 'Enter') submit(); };
  card.append(tokenInput, submitBtn, message);
  overlay.append(card);
  overlay.hidden = false;
  setTimeout(() => tokenInput.focus(), 60);
}
async function checkSecurityLock(){
  try {
    const response = await fetch('/api/security?token=' + encodeURIComponent(TOKEN));
    if (response.status === 401){ showTokenScreen(); return true; }
    const status = await response.json().catch(() => ({}));
    if (response.ok && status.isLocked){ showLockScreen(status); return true; }
  } catch { /* boot continues and surfaces any real API error */ }
  return false;
}
function el(tag, className, text){
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = String(text);
  return node;
}
function toast(message, isError){
  const node = el('div', 'toast' + (isError ? ' error' : ''), message);
  $('#toasts').append(node);
  setTimeout(() => { node.classList.add('bye'); setTimeout(() => node.remove(), 320); }, 3200);
}
function toMs(ts){ const n = Number(ts || 0); return n > 1e12 ? n : n * 1000; }
function clockTime(ts){ return new Date(toMs(ts)).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
function listTime(ts){
  const d = new Date(toMs(ts));
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return clockTime(ts);
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { day: '2-digit', month: '2-digit', year: d.getFullYear() === now.getFullYear() ? undefined : '2-digit' });
}
function dayLabel(ts){
  const d = new Date(toMs(ts));
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return 'TODAY';
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  if (d.toDateString() === yesterday.toDateString()) return 'YESTERDAY';
  return d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
}
function initials(name){
  const parts = String(name || '').trim().split(/\s+/).slice(0, 2);
  return (parts.map(x => x[0] || '').join('') || '◉').toUpperCase();
}
function hueFor(jid){
  let hash = 0;
  const key = String(jid || '');
  for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) % 360;
  return hash;
}

  const jid = chatJid(chat);

  wrap.className = 'avatar ' + (cls || '') + (kind === 'group' ? ' group-icon' : kind === 'channel' ? ' channel-icon' : '');
  wrap.removeAttribute('style');
  const face = el('span', 'avatar-face');
  if (kind === 'group') face.append(icon('group'));
  else if (kind === 'channel') face.append(icon('channel'));
  else {
    wrap.style.background = `hsl(${hueFor(jid)}, 42%, 46%)`;
    face.textContent = initials(chatName(chat));
  }
  wrap.replaceChildren(face);
  const asset = AVATAR_ASSETS[kind];
  if (asset && !brokenAssets.has(asset)){
    const art = el('img', 'avatar-ph');
    art.alt = '';
    art.onerror = () => { brokenAssets.add(asset); art.remove(); };
    wrap.append(art);
    art.src = asset;
  }
  if (jid && kind !== 'broadcast' && chat.hasPicture !== false && !missingPictures.has(jid)){
    const img = el('img', 'pending');
    img.loading = 'lazy';
    img.alt = '';
    // The element has to live in the document before lazy loading kicks in, and it stays
    // invisible until the picture is actually decoded so the placeholder never flickers.
    img.onload = () => { face.remove(); wrap.querySelector('.avatar-ph')?.remove(); img.classList.remove('pending'); wrap.classList.add('with-picture'); wrap.classList.remove('group-icon', 'channel-icon'); };
    img.onerror = () => { missingPictures.add(jid); img.remove(); };
    wrap.append(img);
    img.src = '/api/avatar?jid=' + encodeURIComponent(jid) + '&token=' + encodeURIComponent(TOKEN);
  }
  if (kind === 'channel'){
    const badge = el('span', 'kind-badge');
    badge.append(icon('channel'));
    wrap.append(badge);
  }
  return wrap;
}
function chatAvatarNode(chat, cls){ return fillAvatar(el('span'), chat, cls); }
function chatName(chat){ return chat && (chat.name || chat.subject || chat.notify) || 'WhatsApp chat'; }
function chatJid(chat){ return chat && (chat.id || chat.jid) || ''; }
function chatType(chat){
  const jid = chatJid(chat);
  if (chat?.isChannel || jid.endsWith('@newsletter')) return 'channel';
  if (chat?.isGroup || jid.endsWith('@g.us')) return 'group';
  if (jid.endsWith('@broadcast')) return 'broadcast';

}

}

/* ---------- touch long-press ---------- */
/* Hover-only affordances are unreachable on touch, so a long press opens the same
   menu as a right click. Some browsers also emit a click after the press; that one
   tap is swallowed, but a later tap on the menu stays usable. */
let longPressNode = null;
let longPressAt = 0;
document.addEventListener('click', e => {
  if (!longPressNode) return;
  const node = longPressNode;
  longPressNode = null;
  if (node.contains(e.target) && Date.now() - longPressAt < 700){
    e.stopPropagation();
    e.preventDefault();
  }
}, true);
function longPress(node, open){
  let timer = null, origin = null;
  const cancel = () => { if (timer){ clearTimeout(timer); timer = null; } };
  node.addEventListener('touchstart', e => {
    cancel();
    if (e.touches.length !== 1) return;
    origin = e.touches[0];
    timer = setTimeout(() => {
      timer = null;
      longPressNode = node;
      longPressAt = Date.now();
      open(origin.clientX, origin.clientY);
    }, 450);
  }, { passive: true });
  node.addEventListener('touchmove', e => {
    if (!timer || !origin) return;
    const t = e.touches[0];
    if (Math.abs(t.clientX - origin.clientX) > 10 || Math.abs(t.clientY - origin.clientY) > 10) cancel();
  }, { passive: true });
  node.addEventListener('touchend', cancel, { passive: true });
  node.addEventListener('touchcancel', cancel, { passive: true });
}
function touchMenuGuard(e){ return e.pointerType === 'touch' || Date.now() - longPressAt < 700; }

let lastLinkSig = '';
let lastQrSig = '';
function renderQrSvg(matrix){
  if (!matrix || !Number.isInteger(matrix.size) || !Array.isArray(matrix.rows)) return null;
  const size = matrix.size;
  const pad = 2;
  const total = size + pad * 2;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 ' + total + ' ' + total);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'WhatsApp link QR code');
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  bg.setAttribute('width', String(total));
  bg.setAttribute('height', String(total));
  bg.setAttribute('fill', '#ffffff');
  svg.append(bg);
  let d = '';
  for (let r = 0; r < size; r++){
    const row = String(matrix.rows[r] || '');
    for (let c = 0; c < size; c++){
      if (row[c] === '1') d += 'M' + (c + pad) + ' ' + (r + pad) + 'h1v1h-1z';
    }
  }
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', d);
  path.setAttribute('fill', '#111111');
  svg.append(path);
  return svg;
}

  else qrFrame.append(el('div', 'qr-placeholder', state.connection.status === 'connecting' ? 'Generating QR code… waiting for WhatsApp Web session.' : 'QR code not ready yet. Use phone pairing or click Refresh QR.'));
  const refreshBtn = el('button', 'small-btn', 'Refresh QR');

  refreshBtn.onclick = async () => {

      await api('/api/connection/reconnect', { method: 'POST', body: '{}' });

  const pairMsg = el('div', 'notice');

    codeSlot.replaceChildren();

    const copyBtn = el('button', 'small-btn', 'Copy');
    copyBtn.type = 'button';
    copyBtn.onclick = () => {
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(code).then(() => toast('Pairing code copied'), () => {});
      else toast('Code: ' + code);
    };
    box.append(info, copyBtn);
    codeSlot.append(box);
  };
  renderCodeBox(state.connection.pairingCode, state.connection.pairingPhone);

  form.onsubmit = async e => {
    e.preventDefault();
    const phone = phoneInput.value.trim();
    if (!phone){ pairMsg.textContent = 'Enter a phone number with country code.'; return; }
    pairBtn.disabled = true;
    pairMsg.textContent = 'Requesting pairing code…';
    try {
      const res = await api('/api/connection/pair', { method: 'POST', body: JSON.stringify({ phone }) });
      state.connection.pairingCode = res.code;
      state.connection.pairingPhone = res.phone;
      pairMsg.textContent = '';
      renderCodeBox(res.code, res.phone);
      toast('Pairing code ready');
    } catch (err) {
      pairMsg.textContent = err.message;
    } finally {
      pairBtn.disabled = false;
    }
  };

  side.append(form, pairMsg, codeSlot);
  grid.append(qrCol, side);
  body.append(grid);
  return card;
}
function renderConnectionSlots(force = false){
  const connected = state.connection.connected;
  const qrSig = state.connection.qrUpdatedAt ? String(state.connection.qrUpdatedAt) : (state.connection.hasQr ? '1' : '0');
  const sig = [connected, state.connection.status, qrSig, state.connection.pairingCode || ''].join('|');
  const phIcon = $('#phIcon');
  const phTitle = $('#phTitle');
  const phSub = $('#phSubtitle');
  const slot = $('#linkAccountSlot');
  if (phIcon) phIcon.hidden = !connected;
  if (phTitle) phTitle.textContent = connected ? 'Montra Dashboard' : 'Connect WhatsApp to Montra';
  if (phSub) phSub.textContent = connected
    ? 'Select a chat to view synced history and send messages from your linked WhatsApp account.'
    : 'Link your WhatsApp account with the QR code or your phone number below, or browse synced history.';
  if (slot){
    slot.hidden = connected;
    if (connected){ slot.replaceChildren(); }
    else if (force || sig !== lastLinkSig){
      const activeEl = document.activeElement;
      const typingInSlot = activeEl && slot.contains(activeEl) && activeEl.tagName === 'INPUT';
      if (!typingInSlot) slot.replaceChildren(buildLinkAccountCard(false));
    }
  }
  const settingsSlot = $('#settingsLinkSlot');
  if (settingsSlot){
    if (connected) settingsSlot.replaceChildren();
    else if (force || sig !== lastLinkSig){
      const activeEl = document.activeElement;
      const typingInSettings = activeEl && settingsSlot.contains(activeEl) && activeEl.tagName === 'INPUT';
      if (!typingInSettings) settingsSlot.replaceChildren(buildLinkAccountCard(true));
    }
  }
  lastLinkSig = sig;
  lastQrSig = qrSig;
}
async function loadConnection(){
  try {
    const c = await api('/api/connection');
    state.connection = {
      status: c.status || 'unknown',
      connected: Boolean(c.connected),
      user: c.user || '',
      hasQr: Boolean(c.hasQr),
      qrMatrix: c.qrMatrix || null,
      qrUpdatedAt: c.qrUpdatedAt || null,
      pairingCode: c.pairingCode || null,
      pairingPhone: c.pairingPhone || null
    };
  } catch {
    state.connection = { status: 'unknown', connected: false, user: '', hasQr: false, qrMatrix: null, qrUpdatedAt: null, pairingCode: null, pairingPhone: null };
  }
  const connected = state.connection.connected;
  const strip = $('#connectionStrip');
  strip.hidden = connected || !state.selected;
  $('#connectionText').textContent = 'WhatsApp is ' + (state.connection.status || 'disconnected') + ' — Montra keeps retrying automatically. You can browse synced chats.';
  const input = $('#messageInput');
  input.disabled = !connected || !state.selected;
  input.placeholder = connected ? 'Type a message' : 'Connect WhatsApp to send messages';
  updateSendButton();
  renderConnectionSlots(false);
  renderRailAvatar();
}

/* ---------- daily synced summary widget ---------- */
state.dailySummary = null;
function buildDailySummaryWidget(summary, asSettingsCard = false){
  const card = el('div', asSettingsCard ? 'settings-card analytics-card' : 'home-summary');
  const head = el('div', asSettingsCard ? 'card-head-row' : 'home-summary-head');
  head.append(el('h3', '', 'Daily Synced Summary'));
  const refreshBtn = el('button', 'small-btn', 'Refresh');
  refreshBtn.type = 'button';
  refreshBtn.onclick = () => loadDailySummary(true);
  head.append(refreshBtn);
  card.append(head);

  const body = asSettingsCard ? el('div', 'card-body') : card;
  if (!summary){
    body.append(el('div', 'about-note', 'Loading synced message summary…'));
    return card;
  }
  const totals = summary.totals || {};
  const stats = el('div', 'an-stats');
  stats.append(
    analyticsStat(Number(summary.todayMessages || 0).toLocaleString(), 'Synced today', true),
    analyticsStat(Number(summary.windowMessages || 0).toLocaleString(), 'Last ' + (summary.windowDays || 7) + ' days'),
    analyticsStat(Number(totals.messages || 0).toLocaleString(), 'Total synced'),
    analyticsStat(Number(totals.daysActive || 0).toLocaleString(), 'Active days')
  );
  body.append(stats);

  const catEntries = Object.entries(totals.categories || {}).sort((a, b) => b[1] - a[1]);
  body.append(el('div', 'summary-section-label', 'Message categories'));
  if (catEntries.length){
    const chips = el('div', 'kind-chips');
    catEntries.forEach(([cat, count]) => {
      const chip = el('span', 'kind-chip');
      chip.append(el('span', '', cat), el('b', '', Number(count).toLocaleString()));
      chips.append(chip);
    });
    body.append(chips);
  } else {
    body.append(el('div', 'link-sub', 'No synced messages cached yet. Link WhatsApp to begin syncing.'));
  }

  const chatTypes = totals.chatTypes || {};
  const typeList = [['Direct', chatTypes.chat || 0], ['Groups', chatTypes.group || 0], ['Channels', chatTypes.channel || 0]].filter(([, n]) => n > 0);
  if (typeList.length){
    const typeChips = el('div', 'kind-chips');
    typeChips.style.marginTop = '8px';
    typeList.forEach(([label, count]) => {
      const chip = el('span', 'kind-chip');
      chip.append(el('span', '', label), el('b', '', Number(count).toLocaleString()));
      typeChips.append(chip);
    });
    body.append(typeChips);
  }

  const days = Array.isArray(summary.days) ? summary.days : [];
  if (days.length){
    body.append(el('div', 'summary-section-label', 'Daily breakdown'));
    const dayWrap = el('div', 'summary-days');
    const maxDay = Math.max(1, ...days.map(d => Number(d.total) || 0));
    days.slice().reverse().forEach(d => {
      const row = el('div', 'summary-day-row');
      const dt = new Date(d.date + 'T00:00:00');
      const label = isNaN(dt.getTime()) ? d.date : dt.toLocaleDateString([], { month: 'short', day: 'numeric' });
      const bar = el('div', 'summary-day-bar');
      const fill = el('div', 'summary-day-fill');
      fill.style.width = (d.total ? Math.max(4, Math.round((Number(d.total) / maxDay) * 100)) : 0) + '%';
      bar.append(fill);
      const topCats = Object.entries(d.categories || {}).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([k, v]) => k + ':' + v).join(' ');
      const countLabel = String(d.total || 0) + (topCats ? ' (' + topCats + ')' : '');
      row.append(el('span', '', label), bar, el('b', '', countLabel));
      dayWrap.append(row);
    });
    body.append(dayWrap);
  }
  return card;
}
async function loadDailySummary(notify = false){
  try {
    const summary = await api('/api/daily-summary?days=7');
    const totals = summary?.totals || {};
    const sig = `${summary?.todayMessages || 0}|${summary?.windowMessages || 0}|${totals.messages || 0}|${totals.daysActive || 0}`;
    const changed = sig !== state.lastSummarySig;
    state.lastSummarySig = sig;
    state.dailySummary = summary;
    const slot = $('#dailySummarySlot');
    if (slot && (changed || !slot.hasChildNodes())) {
      slot.replaceChildren(buildDailySummaryWidget(state.dailySummary, false));
    }
    if (notify) toast('Daily summary refreshed');
  } catch { /* ignore transient poll errors */ }
}
async function downloadSettingsJson(){
  try {
    const response = await fetch('/api/settings/export?token=' + encodeURIComponent(TOKEN));
    if (!response.ok){
      const err = await response.json().catch(() => ({}));
      throw Error(err.error || response.statusText || 'Export failed');
    }
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'montra-system-settings.json';
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Downloaded timeConfig.json & system settings');
  } catch (e) { toast(e.message, true); }
}

/* ---------- chats ---------- */
async function loadChats(){
  let newChats;
  try { newChats = await api('/api/chats'); } catch (e) { if (state.view === 'chats') toast(e.message, true); return; }
  const sig = (newChats || []).map(c => `${chatJid(c)}:${c.unreadCount}:${c.lastMessage?.id || ''}:${c.pinned ? 1 : 0}:${c.archived ? 1 : 0}:${c.timestamp || 0}`).join('|');
  const changed = sig !== state.lastChatListSig;
  state.lastChatListSig = sig;
  state.chats = newChats;
  if (state.selected) state.selectedChat = state.chats.find(c => chatJid(c) === state.selected) || state.selectedChat;
  updateTitle();
  renderRailBadge();
  const body = $('#panelBody');
  if (state.view === 'chats' && (changed || !body?.hasChildNodes())) {
    const prevScroll = body ? body.scrollTop : 0;
    renderChatList();
    if (body) body.scrollTop = prevScroll;
  }
}
const FILTER_KINDS = { chats: 'chat', groups: 'group', channels: 'channel' };
function chatPassesFilter(chat){
  if (state.filter === 'unread') return Number(chat.unreadCount || 0) > 0 || chat.localUnread;
  const kind = FILTER_KINDS[state.filter];
  return !kind || chatType(chat) === kind;
}
function renderChatList(){
  const body = $('#panelBody');
  const prevScroll = body ? body.scrollTop : 0;
  body.replaceChildren();
  const q = state.chatQuery.trim().toLowerCase();
  let chats = state.chats.filter(c => (chatName(c) + ' ' + chatJid(c)).toLowerCase().includes(q) && chatPassesFilter(c));
  const archived = chats.filter(c => c.archived);
  const active = chats.filter(c => !c.archived);
  if (state.showArchived){
    const back = el('button', 'back-row');
    back.append(icon('chevron'), el('span', '', 'Archived'));
    back.onclick = () => { state.showArchived = false; renderChatList(); };
    body.append(back);
    if (!archived.length){ body.append(el('div', 'empty-state', 'No archived chats.')); return; }
    archived.forEach(chat => body.append(chatRow(chat)));
    return;
  }
  if (archived.length){
    const row = el('button', 'divider-row');
    row.append(icon('archive'));
    const main = el('div', 'chat-row-main');
    main.append(el('div', 'divider-title', 'Archived'));
    row.append(main, el('span', 'divider-count', archived.length));
    row.onclick = () => { state.showArchived = true; renderChatList(); };
    body.append(row);
  }
  const pinnedOrder = jid => state.prefs.pinned.indexOf(jid);
  const pinned = active.filter(c => c.pinned).sort((a, b) => pinnedOrder(chatJid(a)) - pinnedOrder(chatJid(b)));
  const rest = active.filter(c => !c.pinned);
  if (!pinned.length && !rest.length){
    const scope = { chats: ' private chats', groups: ' groups', channels: ' channels' }[state.filter];
    body.append(el('div', 'empty-state', q ? 'No chats found for “' + q + '”.'
      : scope ? 'No' + scope + ' synced yet.'
      : 'No synced chats yet. Open WhatsApp on your phone so chats can sync.'));
    return;
  }
  let index = 0;
  pinned.forEach(chat => body.append(chatRow(chat, index++)));
  rest.forEach(chat => body.append(chatRow(chat, index++)));
  if (body) body.scrollTop = prevScroll;
}
function chatRow(chat, index){
  const jid = chatJid(chat);
  const kind = chatType(chat);
  const unread = Number(chat.unreadCount || 0) > 0 || chat.localUnread;
  const row = el('button', 'chat-row' + (state.selected === jid ? ' selected' : '') + (unread ? ' unread' : '') + (chat.pinned ? ' pinned' : ''));
  row.type = 'button';
  if (!state.chatListKnown.has(jid)){
    row.classList.add('enter');
    row.style.setProperty('--i', Math.min(index || 0, 12));
    state.chatListKnown.add(jid);
  }
  row.append(chatAvatarNode(chat));
  const main = el('div', 'chat-row-main');
  const line = el('div', 'chat-line');
  line.append(el('span', 'chat-name', chatName(chat)));
  const icons = el('span', 'chat-icons');
  if (chat.muted) icons.append(icon('mute'));
  if (chat.pinned) icons.append(icon('pin'));
  line.append(icons, el('span', 'chat-time', listTime(chat.lastMessageAt || chat.conversationTimestamp)));
  main.append(line);
  const line2 = el('div', 'chat-line2');
  if (chat.lastFromMe && chat.lastKind !== 'revoke'){
    const ticks = ticksNode(chat.lastStatus, true);
    if (ticks) line2.append(ticks);
  }
  let previewText = chat.preview || 'No messages yet';
  if (kind === 'group' && !chat.lastFromMe && chat.lastSender) previewText = chat.lastSender + ': ' + previewText;
  line2.append(el('span', 'chat-preview', previewText));
  if (Array.isArray(chat.crmTags) && chat.crmTags.length){
    const tags = el('span', 'chat-tags');
    chat.crmTags.slice(0, 2).forEach(tag => tags.append(el('span', 'chat-tag', tag)));
    if (chat.crmTags.length > 2) tags.append(el('span', 'chat-tag', '+' + (chat.crmTags.length - 2)));
    line2.append(tags);
  }
  main.append(line2);
  row.append(main);
  if (unread){
    const count = Number(chat.unreadCount || 0);
    row.append(el('span', 'badge' + (count ? '' : ' dot'), count ? (count > 99 ? '99+' : count) : ''));
  }
  const menuBtn = el('span', 'row-menu-btn', '');
  menuBtn.append(icon('chevron'));
  menuBtn.onclick = e => { e.stopPropagation(); const rect = menuBtn.getBoundingClientRect(); chatMenu(chat, rect.left - 160, rect.bottom + 4); };
  row.append(menuBtn);
  row.onclick = () => openChat(chat);
  row.oncontextmenu = e => { e.preventDefault(); if (touchMenuGuard(e)) return; chatMenu(chat, e.clientX, e.clientY); };
  longPress(row, (x, y) => chatMenu(chat, x, y));
  return row;
}
function chatMenu(chat, x, y){
  const jid = chatJid(chat);
  const unread = Number(chat.unreadCount || 0) > 0 || chat.localUnread;
  openMenu([
    { label: chat.pinned ? 'Unpin chat' : 'Pin chat', icon: 'pin', action: () => savePrefs({ action: chat.pinned ? 'unpin' : 'pin', jid }).then(loadChats) },
    { label: chat.muted ? 'Unmute notifications' : 'Mute notifications', icon: 'mute', action: () => savePrefs({ action: chat.muted ? 'unmute' : 'mute', jid }).then(loadChats) },
    { label: unread ? 'Mark as read' : 'Mark as unread', icon: unread ? 'ticks' : 'chat', action: async () => {
        if (unread && state.connection.connected){ try { await api('/api/read', { method: 'POST', body: JSON.stringify({ jid }) }); } catch { /* the local pref is still saved */ } }
        await savePrefs({ action: unread ? 'markRead' : 'markUnread', jid });
        loadChats();
      } },
    { label: chat.archived ? 'Unarchive chat' : 'Archive chat', icon: 'archive', action: () => savePrefs({ action: chat.archived ? 'unarchive' : 'archive', jid }).then(loadChats) }
  ], x, y);
}

/* ---------- conversation ---------- */
async function openChat(chat, mobileOpen = true){
  const jid = chatJid(chat);
  if (state.selected !== jid) stopTyping(state.selected);
  state.selected = jid;
  state.selectedChat = chat;
  state.showArchived = chat.archived;
  state.find = { open: false, query: '', count: 0, index: -1 };
  $('#findBar').hidden = true;
  $('#conversationPlaceholder').hidden = true;
  $('#conversationInner').classList.remove('hidden');
  if (mobileOpen) $('#conversation').classList.add('open');
  $('#convTitle').textContent = chatName(chat);
  const sub = $('#convSub');
  sub.className = 'conv-sub';
  sub.textContent = chatSubtitle(chat);
  fillAvatar($('#convAvatar'), chat);
  const kind = chatType(chat);
  const readOnly = chat.canSend === false || kind === 'channel' || kind === 'broadcast';
  $('#composer').hidden = readOnly;
  const notice = $('#chatNotice');
  notice.hidden = !readOnly;
  if (readOnly){
    notice.replaceChildren(icon(kind === 'channel' ? 'channel' : 'lock'));
    notice.append(el('span', '', kind === 'channel'
      ? 'Channels are broadcast-only. You can react to posts and star them, but not reply.'
      : 'This broadcast list cannot receive messages from you.'));
  }
  updateSendButton();
  $('#messageInput').disabled = !state.connection.connected || readOnly;
  if (!readOnly) requestPresenceSubscription(jid);
  if (state.view === 'chats') renderChatList();
  state.newSinceScroll = 0;
  state.renderedIds = new Set();
  const box = $('#messages');
  const skeleton = setTimeout(() => {
    box.replaceChildren();
    box.append(el('div', 'skel theirs'), el('div', 'skel mine'), el('div', 'skel mine short'),
      el('div', 'skel theirs'), el('div', 'skel theirs short'), el('div', 'skel mine'));
  }, 130);
  try { await loadMessages(true); } finally { clearTimeout(skeleton); }
}
function requestPresenceSubscription(jid){
  if (!jid || state.presenceSubscribed.has(jid) || !state.connection.connected) return;
  api('/api/presence/subscribe', { method: 'POST', body: JSON.stringify({ jid }) })
    .then(() => state.presenceSubscribed.add(jid)).catch(() => {});
}
function stopTyping(jid){
  if (!state.typing.sent || !jid) return;
  clearTimeout(state.typing.timer);
  state.typing.sent = false;
  api('/api/typing', { method: 'POST', body: JSON.stringify({ jid, typing: false }) }).catch(() => {});
}
function closeChat(){
  stopTyping(state.selected);
  state.selected = null;
  state.selectedChat = null;
  state.quoted = null;
  updateReplyBanner();
  $('#conversation').classList.remove('open');
  $('#conversationPlaceholder').hidden = false;
  $('#conversationInner').classList.add('hidden');
  if (state.view === 'chats') renderChatList();
}
async function loadMessages(fresh){
  if (!state.selected) return;
  const box = $('#messages');
  const stick = fresh ? true : isNearBottom(box);
  let rows;
  try { rows = await api('/api/messages?jid=' + encodeURIComponent(state.selected) + '&limit=100'); }
  catch (e) { if (fresh) box.replaceChildren(el('div', 'empty-state', 'Could not load this chat: ' + e.message)); return; }
  const previous = state.messages;
  state.messages = rows;
  const signature = rows.map(m => m.id + ':' + m.status + ':' + m.reactions.length + ':' + (m.deleted ? 1 : 0)).join('|');
  if (signature === state.lastSignature && !state.find.query){ if (!fresh) maybeMarkRead(rows); return; }
  const hadNew = !fresh && previous.length && rows.length > previous.length && !stick;
  if (hadNew) state.newSinceScroll += rows.length - previous.length;
  state.lastSignature = signature;
  const enterIds = fresh ? null : new Set(rows.map(m => m.id).filter(id => !state.renderedIds.has(id)));
  renderMessages(enterIds);
  state.renderedIds = new Set(rows.map(m => m.id));
  maybeMarkRead(rows);
  if (stick){ box.scrollTop = box.scrollHeight; state.newSinceScroll = 0; }
  updateScrollFab();
}
function maybeMarkRead(rows){
  if (!state.connection.connected) return;
  const pending = rows.filter(m => !m.fromMe && !state.readIds.has(m.id)).map(m => m.id);
  if (!pending.length) return;
  pending.forEach(id => state.readIds.add(id));
  api('/api/read', { method: 'POST', body: JSON.stringify({ jid: state.selected }) }).catch(() => {});
}
function updateScrollFab(){
  const box = $('#messages');
  const fab = $('#scrollFab');
  const show = box.scrollHeight - box.scrollTop - box.clientHeight > 200;
  fab.hidden = !show;
  const count = $('#scrollFabCount');
  count.hidden = !state.newSinceScroll;
  count.textContent = state.newSinceScroll;
}
function renderMessages(enterIds){
  const box = $('#messages');
  box.replaceChildren();
  const e2ee = el('div', 'system-pill e2ee');
  e2ee.append(icon('lock'), el('span', '', 'Messages are end-to-end encrypted. Montra sends through your linked WhatsApp account.'));
  box.append(e2ee);
  const rows = state.messages;
  if (!rows.length){
    box.append(el('div', 'empty-state', 'No cached messages for this chat yet. New messages appear here as they sync.'));
    return;
  }
  const isGroup = chatType(state.selectedChat) === 'group';
  let lastDay = null, prev = null;
  for (const m of rows){
    const day = new Date(toMs(m.timestamp)).toDateString();
    if (day !== lastDay){
      box.append(el('div', 'day-pill', dayLabel(m.timestamp)));
      lastDay = day; prev = null;
    }
    const grouped = prev && prev.fromMe === m.fromMe && !m.quoted && (m.timestamp - prev.timestamp) < 300;
    const bubble = renderBubble(m, !grouped, isGroup);
    if (enterIds?.has(m.id)) bubble.classList.add('enter');
    box.append(bubble);
    prev = m;
  }
  updateFindCount();
}
function renderBubble(m, first, isGroup){
  if (m.deleted){
    const node = el('div', 'deleted-bubble');
    node.append(icon('block'), el('span', '', 'This message was deleted'));
    return node;
  }
  const article = el('article', 'bubble ' + (m.fromMe ? 'mine' : 'theirs') + (first ? ' tail' : ''));
  article.dataset.id = m.id;
  article.title = new Date(toMs(m.timestamp)).toLocaleString();
  if (isGroup && !m.fromMe && first){
    const senderName = el('div', 'sender-name', m.sender || chatName(state.selectedChat));
    senderName.style.color = `hsl(${hueFor(m.participant || m.sender)}, 60%, 60%)`;
    article.append(senderName);
  }
  if (m.quoted){
    const quote = el('div', 'quote-block');
    quote.append(el('div', 'quote-name', m.quoted.name || 'Original message'));
    quote.append(el('div', 'quote-text', m.quoted.text || ''));
    quote.onclick = () => scrollToMessage(m.quoted.id);
    article.append(quote);
  }
  const hasMedia = m.hasMedia && ['image','video','voice','sticker','document'].includes(m.kind);
  if (hasMedia){
    const src = '/api/media?jid=' + encodeURIComponent(state.selected) + '&messageId=' + encodeURIComponent(m.id) + '&token=' + encodeURIComponent(TOKEN);
    if (m.kind === 'image'){
      const img = el('img', 'media-img');
      img.loading = 'lazy'; img.alt = m.description || 'Photo'; img.src = src;
      img.onclick = () => openMediaViewer(src, 'image', m);
      article.classList.add('media-bubble');
      if (!m.text) article.classList.add('no-caption');
      article.append(img);
      if (m.text) appendCaption(article, m);
    } else if (m.kind === 'sticker'){
      const img = el('img', 'media-sticker');
      img.loading = 'lazy'; img.alt = 'Sticker'; img.src = src;
      article.classList.add('media-bubble', 'sticker-bubble');
      if (!m.text) article.classList.add('no-caption');
      article.append(img);
      if (m.text) appendCaption(article, m);
    } else if (m.kind === 'video'){
      const video = el('video', 'media-video');
      video.controls = true; video.preload = 'metadata'; video.src = src;
      article.classList.add('media-bubble');
      if (!m.text) article.classList.add('no-caption');
      article.append(video);
      if (m.text) appendCaption(article, m);
    } else if (m.kind === 'voice'){
      article.append(voicePlayer(src, m));
    } else {
      const card = el('a', 'doc-card');
      card.href = src; card.download = m.fileName || 'file';
      card.append(icon('doc'));
      const info = el('div');
      info.append(el('div', 'doc-name', m.fileName || m.description || 'Document'));
      info.append(el('div', 'doc-sub', 'Document · click to download'));
      card.append(info);
      article.append(card);
      if (m.text) appendCaption(article, m);
    }
  } else if (m.kind === 'voice' || m.kind === 'image' || m.kind === 'video' || m.kind === 'sticker' || m.kind === 'document'){
    article.append(el('div', 'bubble-text', m.description || m.kind));
  } else if (m.text){
    const textWrap = el('div', 'bubble-text md-body');
    renderMarkdown(textWrap, m);
    article.append(textWrap);
    if (state.find.query && markTextNodes(textWrap, state.find.query)) article.dataset.hit = '1';
  } else {
    article.append(el('div', 'bubble-text', m.description || 'Message'));
  }
  const meta = el('div', 'bubble-meta');
  meta.append(el('span', '', clockTime(m.timestamp)));
  const ticks = ticksNode(m.status, m.fromMe);
  if (ticks) meta.append(ticks);
  article.append(meta);
  if (m.reactions.length){
    const agg = new Map();
    for (const r of m.reactions) agg.set(r.emoji, (agg.get(r.emoji) || 0) + 1);

function renderMarkdown(node, m){
  // m.html is produced by the server-side engine with raw HTML disabled, so it only
  // contains tags emitted by markdown-it itself; user text arrives escaped.
  if (m.html) node.innerHTML = m.html;
  else node.textContent = m.text || '';
}
function appendCaption(article, m){
  const caption = el('div', 'media-caption md-body');
  renderMarkdown(caption, m);
  article.append(caption);
  if (state.find.query && markTextNodes(caption, state.find.query)) article.dataset.hit = '1';

// Find highlighting runs after Markdown rendering, so it must walk text nodes instead
// of assuming the bubble is a single text string.
function markTextNodes(root, query){
  const needle = String(query || '').toLowerCase();
  if (!needle) return false;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  for (let node = walker.nextNode(); node; node = walker.nextNode()){
    if ((node.nodeValue || '').toLowerCase().includes(needle)) nodes.push(node);
  }
  for (const node of nodes){
    const value = node.nodeValue;
    const lower = value.toLowerCase();
    const frag = document.createDocumentFragment();
    let i = 0, at, hit = false;
    while ((at = lower.indexOf(needle, i)) >= 0){
      if (at > i) frag.append(value.slice(i, at));
      frag.append(el('mark', 'hit', value.slice(at, at + needle.length)));
      hit = true;
      i = at + needle.length;
    }
    if (!hit) continue;
    if (i < value.length) frag.append(value.slice(i));
    node.parentNode.replaceChild(frag, node);
  }
  return nodes.length > 0;
}

/* voice player */
function voicePlayer(src, m){
  const wrap = el('div', 'voice');
  const play = el('button', 'voice-play');
  play.type = 'button';
  const playIcon = icon('play'), pauseIcon = icon('pause');
  play.append(playIcon);
  const bars = el('div', 'voice-bars');
  const count = 34;
  const seed = String(m.id || m.timestamp || '');
  const heights = [];
  for (let i = 0; i < count; i++){
    // An unsynced draft has no id yet, and `i % 0` would produce a NaN height.
    const h = 5 + (seed ? (seed.charCodeAt(i % seed.length) * 7 + i * 13) % 15 : i % 8);
    heights.push(h);
    const bar = el('span');
    bar.style.height = h + 'px';
    bars.append(bar);
  }
  const time = el('span', 'voice-time', '0:' + String(Math.max(0, m.seconds || 0)).padStart(2, '0'));
  const audio = el('audio');
  audio.preload = 'metadata';
  audio.src = src;
  audio.onloadedmetadata = () => {
    if (isFinite(audio.duration) && audio.duration > 0) time.textContent = fmtAudio(Math.round(audio.duration));
  };
  function fmtAudio(s){ return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  play.onclick = () => {
    if (audio.paused){ audio.play(); play.replaceChildren(pauseIcon); }
    else { audio.pause(); play.replaceChildren(playIcon); }
  };
  audio.ontimeupdate = () => {
    const frac = isFinite(audio.duration) && audio.duration ? audio.currentTime / audio.duration : 0;
    const onCount = Math.round(frac * count);
    [...bars.children].forEach((bar, i) => bar.classList.toggle('on', i < onCount));
    const remaining = Math.max(0, Math.round((audio.duration || m.seconds || 0) - audio.currentTime));
    time.textContent = fmtAudio(remaining);
  };
  audio.onended = () => { play.replaceChildren(playIcon); [...bars.children].forEach(bar => bar.classList.remove('on')); };
  wrap.append(play, bars, time);
  return wrap;
}

function gotoFind(index){

  const target = hits[state.find.index];

  setTimeout(() => target.classList.remove('flash'), 700);

      if (contact.hasChat){
        const chat = state.chats.find(c => chatJid(c) === contact.jid);
        if (chat){ closeNewChat(); openChat(chat); return; }
      }
      if (chatType(contact) === 'group'){ toast('This group has no synced chat yet'); return; }
      if (chatType(contact) === 'channel'){ toast('Channels cannot receive messages'); return; }
      const phone = contact.jid.split('@')[0].replace(/[^0-9]/g, '');
      try {
        await api('/api/chats', { method: 'POST', body: JSON.stringify({ phone }) });
        await loadChats();
        closeNewChat();
        const fresh = state.chats.find(c => chatJid(c) === contact.jid);
        if (fresh) openChat(fresh);
      } catch (e) { toast(e.message, true); }
    };
    list.append(row);
  }

/* ---------- status ---------- */
function groupStatuses(){
  const own = state.connection.user;
  const groups = new Map();
  for (const s of state.statuses){
    const key = s.participant || '';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  }
  const mine = own ? (groups.get(own) || []) : [];
  const others = [...groups.entries()].filter(([key]) => key !== own);
  return { mine, others };
}
async function loadStatuses(){
  try {
    const fresh = await api('/api/statuses');
    const sig = (fresh || []).map(s => s.id + ':' + s.timestamp).join('|');
    const existing = $('#statusViewWrap');
    if (state.lastStatusSig === sig && existing && state.view === 'status') return;
    state.lastStatusSig = sig;
    state.statuses = fresh;
  } catch (e) { if (state.view === 'status') toast(e.message, true); return; }
  if (state.view === 'status') renderStatusView();
}

function localDateTimeValue(date){
  const pad = n => String(n).padStart(2, '0');
  return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
}
function readFileBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || '').split(',')[1] || '');
    reader.onerror = () => reject(reader.error || Error('Could not read the selected file.'));
    reader.readAsDataURL(file);
  });
}
async function loadScheduledStories(){
  const list = $('#scheduledStories');
  if (!list) return;
  try {
    const data = await api('/api/stories/scheduled');
    const stories = Array.isArray(data.stories) ? data.stories : [];
    const count = $('#schedCount');
    if (count){
      const pending = stories.filter(s => s.status === 'pending').length;
      count.textContent = pending + ' queued · ' + stories.length + ' total';
    }
    const schedSig = stories.map(s => s.id + ':' + s.status).join('|');
    if (state.lastSchedSig === schedSig && list.children.length > 0) return;
    state.lastSchedSig = schedSig;
    list.replaceChildren();
    if (!stories.length){
      list.append(el('div', 'sched-empty', 'Nothing queued yet. Schedule a text, photo or video status and Montra will publish it at the right time.'));
      return;
    }
    for (const story of stories){
      const row = el('div', 'sched-item');
      const badgeIcon = el('span', 'sched-icon');
      badgeIcon.append(icon(story.type === 'text' ? 'note' : story.type === 'video' ? 'play' : 'image'));
      const main = el('div', 'sched-main');
      const title = story.type === 'text' ? (story.caption || 'Text status') : (story.type === 'video' ? 'Video status' : 'Photo status');
      main.append(el('div', 'sched-title', title));
      const when = Number.isFinite(Number(story.scheduledAt)) ? new Date(Number(story.scheduledAt)).toLocaleString() : (story.scheduledAtIso || 'time unknown');
      main.append(el('div', 'sched-sub', when + ' · ' + (story.folder || ('stories/' + story.date))));
      const status = ['pending', 'posted', 'failed'].includes(story.status) ? story.status : 'pending';
      const label = status === 'posted' ? '✅ posted' : status === 'failed' ? '❌ failed' : (story.lastError ? '⏳ retrying' : '⏳ pending');
      const badge = el('span', 'sched-badge ' + status, label);
      if (story.lastError) badge.title = story.lastError;
      const remove = el('button', 'sched-del');
      remove.type = 'button';
      remove.title = 'Delete scheduled post';
      remove.append(icon('trash'));
      remove.onclick = async () => {
        remove.disabled = true;
        try {
          const out = await api('/api/stories/scheduled', { method: 'DELETE', body: JSON.stringify({ date: story.date, id: story.id }) });
          if (!out.ok) throw Error('Status not found or already deleted.');
          toast('Scheduled status deleted');
          loadScheduledStories();
        } catch (e) { toast(e.message, true); remove.disabled = false; }
      };
      row.append(badgeIcon, main, badge, remove);

    const type = typeSelect.value;

let svState = { participant: '', index: 0, list: [] };
let svTimer = null;
const SV_IMAGE_MS = 8000;
function clearStatusTimer(){ if (svTimer) { clearTimeout(svTimer); svTimer = null; } }
function scheduleStatusAdvance(ms){
  clearStatusTimer();
  svTimer = setTimeout(() => {
    svTimer = null;
    if (svState.index < svState.list.length - 1) { svState.index += 1; renderStatusViewer(); }
    else closeStatusViewer();
  }, ms);
}
function statusMediaSrc(status, participant){
  const id = status.mediaId || status.id;
  return '/api/status-media?id=' + encodeURIComponent(id)
    + '&participant=' + encodeURIComponent(status.participant || participant || '')
    + '&token=' + encodeURIComponent(TOKEN);
}
function openStatusViewer(participant, index){
  const { mine, others } = groupStatuses();
  const list = participant === state.connection.user ? mine : (others.find(([key]) => key === participant)?.[1] || []);
  if (!list.length) return;
  svState = { participant, index: Math.max(0, Math.min(index, list.length - 1)), list };
  renderStatusViewer();
  $('#statusViewer').hidden = false;
}
function showStatusMediaError(body, status, mediaEl, at){
  if (svState.index !== at || !$('#statusViewer').contains(body)) return;
  if (mediaEl) mediaEl.remove();
  const caption = body.querySelector('.sv-caption');
  if (caption) caption.remove();
  const wrap = el('div', 'sv-fallback');
  wrap.append(el('div', 'sv-text', status.text || 'Status media'));
  wrap.append(el('div', 'sv-media-note', status.mediaError === 'media_key_missing'
    ? 'WhatsApp did not share the key needed to download this status media.'
    : 'This status media is no longer available from WhatsApp.'));
  body.append(wrap);
  scheduleStatusAdvance(SV_IMAGE_MS);
}
function renderStatusViewer(){
  clearStatusTimer();
  const viewer = $('#statusViewer');
  const { participant, index, list } = svState;
  viewer.replaceChildren();
  const head = el('div', 'sv-head');
  const progress = el('div', 'sv-progress');
  list.forEach((s, i) => {
    const bar = el('span', 'bar' + (i < index ? ' done' : i === index ? ' current' : ''));
    if (i === index) bar.style.setProperty('--sv-duration', (s.kind === 'image' || s.kind === 'text' ? 8 : 15) + 's');
    progress.append(bar);
  });
  head.append(progress);
  const titleRow = el('div', 'sv-title-row');
  const avatar = avatarNode(participant, list[index].name || 'Status', 'small');
  titleRow.append(avatar, el('div', 'sv-name', list[index].name || prettyPhone(participant) || 'Status'));
  titleRow.append(el('div', 'sv-time', listTime(list[index].timestamp)));
  const close = el('button', 'icon-btn'); close.title = 'Close'; close.append(icon('close'));
  close.onclick = closeStatusViewer;
  titleRow.append(close);
  head.append(titleRow);
  viewer.append(head);
  const body = el('div', 'sv-body');
  const status = list[index];
  const isVideo = status.kind === 'video';
  const hasMedia = isVideo || status.kind === 'image';
  if (hasMedia){
    const src = statusMediaSrc(status, participant);
    if (isVideo){
      const video = el('video');
      video.src = src; video.controls = true; video.autoplay = true; video.playsInline = true;
      video.onended = () => {
        if (svState.index !== index) return;
        if (svState.index < svState.list.length - 1) { svState.index += 1; renderStatusViewer(); }
        else closeStatusViewer();
      };
      video.onerror = () => showStatusMediaError(body, status, video, index);
      body.append(video);
      const play = video.play?.();
      if (play && play.catch) play.catch(() => {});
    } else {
      const img = el('img'); img.src = src; img.alt = status.text || 'Status';
      img.onerror = () => showStatusMediaError(body, status, img, index);
      body.append(img);
      scheduleStatusAdvance(SV_IMAGE_MS);
    }
    if (status.text) body.append(el('div', 'sv-caption', status.text));
  } else {
    body.append(el('div', 'sv-text', status.text || 'This status is empty.'));
    scheduleStatusAdvance(SV_IMAGE_MS);
  }
  if (index > 0){
    const prev = el('button', 'sv-nav sv-prev'); prev.append(icon('back'));
    prev.onclick = () => { svState.index--; renderStatusViewer(); };
    body.append(prev);
  }
  if (index < list.length - 1){
    const next = el('button', 'sv-nav sv-next'); next.append(icon('back')); next.firstChild.style.transform = 'rotate(180deg)';
    next.onclick = () => { svState.index++; renderStatusViewer(); };
    body.append(next);
  }
  viewer.append(body);
  api('/api/statuses/view', { method: 'POST', body: JSON.stringify({ id: status.id, participant: status.participant }) }).catch(() => {});
}
function closeStatusViewer(){
  clearStatusTimer();
  $('#statusViewer').hidden = true;
  $('#statusViewer').replaceChildren();
  svState = { participant: '', index: 0, list: [] };
}

function renderStarredView(){
  const body = $('#panelBody');
  body.replaceChildren();
  const entries = [];
  for (const [jid, ids] of Object.entries(state.prefs.starred || {})) for (const id of ids) entries.push({ jid, id });
  if (!entries.length){
    body.append(el('div', 'empty-state', 'No starred messages. Star a message from its menu to keep it here.'));
    return;
  }
  (async () => {
    for (const entry of entries){
      const key = entry.jid + '|' + entry.id;
      if (!state.starredCache.has(key)){
        try { state.starredCache.set(key, await api('/api/message?jid=' + encodeURIComponent(entry.jid) + '&id=' + encodeURIComponent(entry.id))); }
        catch { state.starredCache.set(key, null); }
      }
      const message = state.starredCache.get(key);
      const chat = state.chats.find(c => chatJid(c) === entry.jid);
      const row = el('button', 'chat-row');
      row.type = 'button';

      const main = el('div', 'chat-row-main');

      main.append(el('div', 'chat-preview', message ? (message.text || message.description || 'Message') : 'Message no longer cached'));

      track.append(bar);

      col.append(el('span', 'bar-count', String(count)), track, el('small', '', day.toLocaleDateString([], { weekday: 'short' })));
      chart.append(col);
    });
    tBody.append(chart);
    trendCard.append(tBody);
    wrap.append(trendCard);
  }

  const hours = Array.isArray(data.hourlyHeatmap) ? data.hourlyHeatmap : [];
  if (hours.length){
    const heatCard = el('div', 'settings-card analytics-card');
    heatCard.append(el('h3', '', 'Peak activity hours'));
    const hBody = el('div', 'card-body');
    const maxHour = Math.max(1, ...hours);
    const heat = el('div', 'heat-grid');
    hours.forEach((count, hour) => {
      const value = Number(count) || 0;
      const cell = el('div', 'heat-cell');
      if (value) cell.style.background = 'rgba(180,107,255,' + (0.16 + 0.74 * value / maxHour).toFixed(2) + ')';
      cell.title = String(hour).padStart(2, '0') + ':00 — ' + value + ' messages';
      cell.append(el('span', '', String(hour).padStart(2, '0')));
      heat.append(cell);
    });
    hBody.append(heat);
    const legend = el('div', 'heat-legend');
    legend.append(el('span', '', 'Quiet'), el('i'), el('span', '', 'Busy · 24h local time'));
    hBody.append(legend);
    heatCard.append(hBody);
    wrap.append(heatCard);
  }

  const ab = data.antiBan;
  if (ab){
    const abCard = el('div', 'settings-card analytics-card');
    const abHead = el('div', 'card-head-row');
    abHead.append(el('h3', '', 'Anti-ban quota'));
    abHead.append(el('span', 'risk-pill ' + String(ab.riskLevel || 'low_risk').toLowerCase(), String(ab.riskLevel || 'LOW_RISK').replace(/_/g, ' ')));
    abCard.append(abHead);
    const abBody = el('div', 'card-body');
    const warm = ab.warmup || {};
    const through = ab.throughput || {};
    abBody.append(quotaLine('Daily warm-up quota', Number(warm.sentToday || 0).toLocaleString(), Number(warm.dailyLimit || 0).toLocaleString(), Number(warm.percentUsed || 0)));
    const perMinute = through.maxAllowed ? (Number(through.lastMinuteMsgs || 0) / Number(through.maxAllowed)) * 100 : 0;
    abBody.append(quotaLine('Last minute throughput', Number(through.lastMinuteMsgs || 0), Number(through.maxAllowed || 0), perMinute));
    const score = Number(ab.securityScore ?? 100);
    abBody.append(quotaLine('Security score', score, '100', score));
    const trip = ab.tripwire || {};
    abBody.append(el('div', 'about-note', trip.active
      ? 'Tripwire active — cooldown ' + Number(trip.secondsRemaining || 0) + 's. Sends are paused until it clears.'
      : 'Tripwire clear · warm-up day ' + Number(warm.daysActive || 1) + ' · fingerprint ' + String(ab.fingerprint || 'default') + '.'));
    abCard.append(abBody);
    wrap.append(abCard);
  }

  const kinds = Object.entries(data.kinds || {}).sort((a, b) => b[1] - a[1]).slice(0, 8);
  if (kinds.length){
    const kCard = el('div', 'settings-card analytics-card');
    kCard.append(el('h3', '', 'Message mix'));
    const kBody = el('div', 'card-body');
    const chips = el('div', 'kind-chips');
    kinds.forEach(([kind, count]) => {
      const chip = el('span', 'kind-chip');
      chip.append(el('span', '', kind), el('b', '', String(count)));
      chips.append(chip);
    });
    kBody.append(chips);
    kCard.append(kBody);
    wrap.append(kCard);
  }

  const chatters = data.topChatters || [];
  if (chatters.length){
    const cCard = el('div', 'settings-card analytics-card');
    cCard.append(el('h3', '', 'Top participants'));
    const cBody = el('div', 'card-body');
    const maxCount = Math.max(1, ...chatters.map(c => Number(c.count) || 0));
    chatters.forEach(c => {
      const count = Number(c.count) || 0;
      const row = el('div', 'chatter-row');
      row.append(el('span', '', c.sender || 'unknown'), el('b', '', String(count)));
      const track = el('div', 'chatter-track');
      const fill = el('div', 'chatter-fill');
      fill.style.width = Math.max(3, Math.round(count / maxCount * 100)) + '%';
      track.append(fill);
      row.append(track);
      cBody.append(row);
    });
    cCard.append(cBody);
    wrap.append(cCard);
  }

  body.append(wrap);
  body.classList.remove('view-enter');
  void body.offsetWidth;
  body.classList.add('view-enter');
}

async function loadSecurityStatus(){
  const node = $('#securityStatus');
  if (!node) return;
  try {
    const status = await api('/api/security');
    node.textContent = (status.isLocked ? '🔒 Locked' : '🔓 Unlocked') + ' · PIN hint ' + (status.pinHint || 'None');
  } catch (e) { node.textContent = e.message; }
}
async function loadAlertRules(){
  const list = $('#alertRules');
  if (!list) return;
  try {
    const data = await api('/api/alerts');
    const rules = Array.isArray(data.rules) ? data.rules : [];
    list.replaceChildren();
    if (!rules.length){ list.append(el('div', 'crm-hint', 'No alert rules yet. Add one below.')); return; }
    for (const rule of rules){
      const row = el('div', 'rule' + (rule.enabled ? '' : ' off'));
      const top = el('div', 'rule-top');
      top.append(el('span', 'rule-title', '[' + rule.trigger + ']'));
      const actions = el('div', 'rule-actions');
      const toggle = el('button', 'small-btn', rule.enabled ? 'Pause' : 'Enable');
      toggle.type = 'button';
      toggle.onclick = async () => {
        try {
          await api('/api/alerts', { method: 'POST', body: JSON.stringify({ action: 'toggle', id: rule.id, enabled: !rule.enabled }) });
          loadAlertRules();
        } catch (e) { toast(e.message, true); }
      };
      const remove = el('button', 'small-btn danger', 'Delete');
      remove.type = 'button';
      remove.onclick = async () => {
        try {
          const out = await api('/api/alerts', { method: 'DELETE', body: JSON.stringify({ id: rule.id }) });
          if (!out.ok) throw Error('Rule not found.');
          toast('Alert rule removed');
          loadAlertRules();
        } catch (e) { toast(e.message, true); }
      };
      actions.append(toggle, remove);
      top.append(actions);
      row.append(top, el('div', 'rule-body', rule.template));
      list.append(row);
    }
  } catch (e) { list.replaceChildren(el('div', 'crm-hint', e.message)); }
}
async function loadCallLog(){
  const list = $('#callLog');
  if (!list) return;
  try {
    const data = await api('/api/calls?limit=8');
    const calls = Array.isArray(data.calls) ? data.calls : [];
    list.replaceChildren();
    if (!calls.length){ list.append(el('div', 'crm-hint', 'No incoming calls recorded yet.')); return; }
    for (const call of calls){
      const row = el('div', 'call-row');
      row.append(icon('phone'));
      const main = el('div', 'call-main');
      main.append(el('div', 'call-name', call.isVideo ? '📹 Video call' : '📞 Voice call'));
      main.append(el('div', 'call-sub', [call.phone, call.status, call.time].filter(Boolean).join(' · ')));
      row.append(main);
      list.append(row);
    }
  } catch (e) { list.replaceChildren(el('div', 'crm-hint', e.message)); }
}
async function loadProfile(){
  const form = $('#profileForm');
  if (!form) return;
  try {
    const p = await api('/api/profile');
    form.elements.name.value = p.name || '';
    form.elements.about.value = p.about || '';
    const info = document.querySelector('.profile-card .p-info');
    if (info){
      info.querySelector('.p-name').textContent = p.name || 'WhatsApp profile';
      info.querySelector('.p-about').textContent = [p.about, prettyPhone(p.jid)].filter(Boolean).join(' · ');
    }
    const av = document.querySelector('#settingsAvatar');
